<!-- l102-topbar:start  Shared level102 top bar. Copy this whole block VERBATIM into every game (tests check it).
     HEAD part: paste right after <meta name="viewport">, before the game's own styles, so language and text size are
     known before the first paint (no flash of English).
     Gives the page: <html lang> = en|es|de (saved choice > OS language > English), CSS var --fs (text scale 0.8..1.8, default 1.1),
     a download link (the page itself, offline), CSS var --l102-bar-h (height of the bar; the game must keep its own UI below it), window.L102 = { lang, fs, langs,
     setLang(l), setFs(v) }, and the events 'l102:lang' and 'l102:fs' on window. -->
<style>

  padding:3px max(8px,env(safe-area-inset-right)) 3px max(8px,env(safe-area-inset-left));background:rgba(12,6,28,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;

<script>
(function(){
  var LANGS=["en","es","de"],h=document.documentElement,lang=null,fs=1.1;
  try{lang=localStorage.getItem("l102.lang");fs=parseFloat(localStorage.getItem("l102.fs"))||1.1;}catch(e){}
  if(LANGS.indexOf(lang)<0){lang="en";var n=navigator.languages||[navigator.language||"en"];
    for(var i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(LANGS.indexOf(c)>=0){lang=c;break;}}}
  var clamp=function(v){return Math.round(Math.min(1.8,Math.max(.8,v))*10)/10;};
  fs=clamp(fs);h.lang=lang;h.style.setProperty("--fs",fs);
  window.L102={lang:lang,fs:fs,langs:LANGS,
    setLang:function(l){if(LANGS.indexOf(l)<0||l===this.lang)return;this.lang=l;h.lang=l;try{localStorage.setItem("l102.lang",l);}catch(e){}
      dispatchEvent(new CustomEvent("l102:lang",{detail:l}));},
    setFs:function(v){v=clamp(v);if(v===this.fs)return;this.fs=v;h.style.setProperty("--fs",v);try{localStorage.setItem("l102.fs",v);}catch(e){}
      dispatchEvent(new CustomEvent("l102:fs",{detail:v}));}};
})();
</script>

<script>
(function(){
  var T={en:["Back to level102.com","Language","Smaller text","Bigger text","Download for offline use","Full screen","Exit full screen"],
         es:["Volver a level102.com","Idioma","Texto más pequeño","Texto más grande","Descargar para jugar sin conexión","Pantalla completa","Salir de pantalla completa"],
         de:["Zurück zu level102.com","Sprache","Kleinere Schrift","Größere Schrift","Zum Offline-Spielen herunterladen","Vollbild","Vollbild beenden"]};
  var back=document.getElementById("l102back"),sel=document.getElementById("l102lang"),
      minus=document.getElementById("l102minus"),plus=document.getElementById("l102plus"),dl=document.getElementById("l102dl"),
      full=document.getElementById("l102full"),fullp=document.getElementById("l102fullp"),d=document,de=d.documentElement;
  // full screen: browser's own exit (Esc, Android back) also works; hidden where unsupported (e.g. iPhone)
  function isFull(){return !!(d.fullscreenElement||d.webkitFullscreenElement);}
  if(!(d.fullscreenEnabled||d.webkitFullscreenEnabled))full.hidden=true;
  full.addEventListener("click",function(){try{var p=isFull()?(d.exitFullscreen||d.webkitExitFullscreen).call(d)
    :(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)p.catch(function(){});}catch(e){}});
  d.addEventListener("fullscreenchange",paint);d.addEventListener("webkitfullscreenchange",paint);
  // download = this very page (one self-contained file), named after its folder: /drinkmixer/ -> drinkmixer.html
  var parts=location.pathname.split("/").filter(Boolean),last=parts[parts.length-1]||"";
  if(/\.html?$/.test(last))last=parts[parts.length-2]||"";
  dl.href=location.href.split("#")[0].split("?")[0];dl.setAttribute("download",(last&&last!=="docs"?last:"level102")+".html");
  function paint(){var t=T[L102.lang];back.textContent="‹ "+t[0];sel.value=L102.lang;sel.setAttribute("aria-label",t[1]);
    minus.setAttribute("aria-label",t[2]);minus.title=t[2];plus.setAttribute("aria-label",t[3]);plus.title=t[3];
    dl.setAttribute("aria-label",t[4]);dl.title=t[4];
    var f=isFull();full.setAttribute("aria-label",t[f?6:5]);full.title=t[f?6:5];full.setAttribute("aria-pressed",f);
    fullp.setAttribute("d",f?"M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5":"M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5");
    minus.disabled=L102.fs<=.8;plus.disabled=L102.fs>=1.8;}
  sel.addEventListener("change",function(){L102.setLang(sel.value);});
  minus.addEventListener("click",function(){L102.setFs(L102.fs-.1);});
  plus.addEventListener("click",function(){L102.setFs(L102.fs+.1);});
  addEventListener("l102:lang",paint);addEventListener("l102:fs",paint);paint();
})();
</script>

// ---------------------------------------------------------------- setup
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
let cw, ch, ZOOM = 1.5;
let SC = 1;   // canvas pixels per virtual (zoomed) pixel
function resize() {
  // phones: 1.5 is plenty sharp and far cheaper to fill than 3x; bigger screens up to 2
  const dpr = Math.min(Math.min(innerWidth, innerHeight) < 600 ? 1.5 : 2, devicePixelRatio || 1);
  // everything is drawn 1.5x bigger; small screens zoom less so the car still fits
  ZOOM = clamp(Math.min(innerWidth / 520, innerHeight / 420), .55, 1.5);
  cw = innerWidth / ZOOM; ch = innerHeight / ZOOM;   // virtual (zoomed) canvas size
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  SC = dpr * ZOOM; ctx.setTransform(SC, 0, 0, SC, 0, 0);
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const man = (a, b, c, d) => Math.abs(a - c) + Math.abs(b - d);
const dist = (p, q) => Math.hypot(p.a - q.a, p.b - q.b);

addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- tiny sfx
let AC = null;
function beep(f = 440, d = .08, type = 'square', v = .05, slide = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

// copy the current language's names/descs into the data tables (the English originals are kept in ._en)
function applyLang() {

    const v = tr === undefined ? null : tr;

}

const atk = () => 1 + (G.inv.sword || 0) + (G.inv.beard || 0) + G.loop;

// ---------------------------------------------------------------- level gen (tile grid)
function grid0(L) { const g = []; for (let a = 0; a < L; a++) g.push(new Array(W).fill(0)); return g; }
const inb = (a, b) => a >= 0 && a < G.L && b >= 0 && b < W;
const isObs = (a, b) => !inb(a, b) || G.grid[a][b] === 1;
const blockedCount = (a, b) => DIRS.reduce((n, [da, db]) => n + (isObs(a + da, b + db) ? 1 : 0), 0);
const tileOf = e => [Math.round(e.a), Math.round(e.b)];

function genCrystal(L) {
  const g = grid0(L);
  // crystal pillars along the walls -> alcoves to hide in
  for (let a = 5; a < L - 4; a += 3 + ri(3)) {
    const side = rnd() < .5 ? 0 : W - 1;
    g[a][side] = 1;
    if (rnd() < .65) g[a + 2][side] = 1;
    if (rnd() < .4) g[a][side === 0 ? 1 : W - 2] = 1;
  }
  // crystal clusters in the middle
  for (let i = 0; i < 13; i++) {
    let a = 4 + ri(L - 8), b = 1 + ri(W - 2);
    const n = 1 + ri(3);
    for (let k = 0; k < n; k++) {
      g[a][b] = 1;
      if (rnd() < .5) a = clamp(a + (rnd() < .5 ? 1 : -1), 4, L - 4);
      else b = clamp(b + (rnd() < .5 ? 1 : -1), 0, W - 1);
    }
  }
  return g;
}
function genMud(L) {
  const g = grid0(L);
  // cargo barriers across the car with gaps -> chokepoints, ambushes behind them
  for (let a = 6; a < L - 4; a += 5 + ri(2)) {
    const gaps = new Set([ri(W), ri(W)]);
    if (rnd() < .5) gaps.add(ri(W));
    for (let b = 0; b < W; b++) if (!gaps.has(b)) g[a][b] = 1;
    const pb = ri(W);
    if (!gaps.has(pb) && !gaps.has(pb + 1) && !gaps.has(pb - 1)) g[a + 2][pb] = 1;
  }
  for (let i = 0; i < 10; i++) g[4 + ri(L - 8)][ri(W)] = 1;
  return g;
}

function bfs(a0, b0) {
  const d = G.grid.map(r => r.map(() => Infinity));
  if (!inb(a0, b0) || isObs(a0, b0)) return d;
  d[a0][b0] = 0; const q = [[a0, b0]];
  for (let i = 0; i < q.length; i++) {
    const [a, b] = q[i];
    for (const [da, db] of DIRS) {
      const na = a + da, nb = b + db;
      if (isObs(na, nb) || d[na][nb] !== Infinity) continue;
      d[na][nb] = d[a][b] + 1; q.push([na, nb]);
    }
  }

}

function buildLevel() {
  const th = theme();
  G.L = th.L + Math.min(18, G.depth + G.loop);
  for (let tries = 0; tries < 50; tries++) {
    G.grid = th.gen(G.L);
    for (let a = 0; a < 3; a++) for (let b = 0; b < W; b++) G.grid[a][b] = 0;
    for (let a = G.L - 2; a < G.L; a++) G.grid[a][MID] = 0;
    G.reach = bfs(0, MID);
    if (G.reach[G.L - 1][MID] < Infinity) break;
  }
  G.enemies = []; G.items = []; G.shots = []; G.puddles = []; G.fx = []; G.parts = []; G.texts = []; G.hist = [];
  G.ohp = {};
  for (let a = 0; a < G.L; a++) for (let b = 0; b < W; b++) if (G.grid[a][b]) G.ohp[a * W + b] = obstacleHp(a, b);
  const p = G.player;
  Object.assign(p, { a: 0, b: MID, invT: 0, lastMud: null });
  Object.assign(G.dog, { a: -.4, b: MID - .6 });
  Object.assign(G.robo, { a: -.4, b: MID + .6 }); G.trails = [];
  Object.assign(G.pierobot, { a: -.4, b: MID + 1.2 }); Object.assign(G.cbun, { a: -.6, b: MID - 1.2 });

    if (!G.grid[a][b] && G.reach[a][b] < Infinity) G.cands.push([a, b]);
  th.pop();
  G.waveT = 14;
  const crowd = Math.min(75, Math.round(2 * G.depth + .12 * G.depth * G.depth) + G.loop * 2);
  for (let i = 0; i < crowd; i++) {   // every car is more packed than the last
    const s = chooseSpot({ minA: 6, sp: G.depth > 6 ? 1 : 2 });
    if (s) addEnemy(pick(th === THEMES[0] ? ['ant', 'geode'] : ['mud', 'slime', 'ape']), s[0], s[1]);

// treasure chests tucked into alcoves and corners (often guarded)
function placeChests() {
  G.chests = [];
  const n = 2 + ri(2) + (G.loop ? 1 : 0) + Math.floor(G.depth / 4);
  for (let i = 0; i < n; i++) {
    const s = chooseSpot({ minA: 6, sp: 1, pref: (a, b) => blockedCount(a, b) * 3 - (G.chests.some(c => man(c.a, c.b, a, b) < 5) ? 60 : 0) });

// from car 2 on, the Goose waits by the door with three things for sale. Walk onto one to buy it.
function placeExit() {   // every 10th car has a way off the train, in the side wall
  G.exitDoor = null;
  if ((G.depth + 1) % 10) return;
  const reach = bfs(0, MID);
  for (const a of [G.L >> 1, (G.L >> 1) + 2, (G.L >> 1) - 2, (G.L >> 1) + 4, 8, 12]) {

    for (const b of [0, 1]) { G.grid[a][b] = 0; delete G.ohp[a * W + b]; }
    const r2 = bfs(0, MID);

// how tough each obstacle is: crates splinter, mud mounds take a beating, some crystals are almost unbreakable

function hitTile(ta, tb, d) {

// how good a tile is for an enemy to wait in: alcoves, behind cover, chokepoints
function spotScore(a, b) {

  const bc = blockedCount(a, b);
  if (bc >= 3) s += 6; else if (bc === 2) s += 3;
  if (isObs(a - 1, b)) s += 4;                    // cover between it and the player's approach
  if (isObs(a - 1, b - 1) || isObs(a - 1, b + 1)) s += 1;
  let open = 0; for (let bb = 0; bb < W; bb++) if (!G.grid[a][bb]) open++;
  if (open <= 5) s += 3;                          // guarding a chokepoint
  if (b === MID && !isObs(a - 1, b)) s -= 2;      // standing in the open aisle is boring

}

  }
  if (paused) {
    ctx.fillStyle = 'rgba(8,5,16,.6)'; ctx.fillRect(0, 0, cw, ch);   // the pause panel itself is HTML (#pausePanel)
  }
  const items = () => Object.values(G.inv).reduce((n, v) => n + v, 0);
  if (G.state === 'left') {
    const g = ctx.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, 'rgba(120,200,255,.92)'); g.addColorStop(1, 'rgba(90,170,70,.95)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    textBlock([[t('leftT'), 40, '#fff6c8', 0, true], [t('leftS'), 16, '#fff', 14],
      [statLine([['sKills', G.kills], ['sCoins', G.coins], ['sItems', items()], ['sSize', Math.round(G.size * 100) + '%']]), 16, '#fff', 12],
      [t(isTouch ? 'againTouch' : 'againKey'), 18, '#fff', 24]]);
  }
  if (G.state === 'dead') {
    ctx.fillStyle = 'rgba(8,5,16,.75)'; ctx.fillRect(0, 0, cw, ch);
    textBlock([[t('deadT'), 44, '#ff5d73', 0, true],
      [statLine([['sKills', G.kills], ['sCoins', G.coins], ['sItems', items()]]), 16, '#ddd', 18],
      [t(isTouch ? 'againTouch' : 'againKey'), 18, '#fff', 22]]);
  }
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
function frame(now) {
  const ov = G.state !== 'play' ? G.state : paused ? 'paused' : G.trans ? 'trans' : '';   // full-screen canvas message up?
  if (document.body.dataset.ov !== ov) { document.body.dataset.ov = ov; document.body.classList.toggle('ov', !!ov); }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (paused) { render(0); requestAnimationFrame(frame); return; }
  G.time += dt;
  if (G.shake > 0) G.shake -= dt;
  if (G.trans) {
    G.trans.t -= dt;
    if (!G.trans.built && G.trans.t < 1.05) {      // swap cars while the screen is black
      G.trans.built = true; G.depth++; G.level = G.trans.level; G.loop = G.trans.loop;
      G.player.maxHp += 2; G.player.hp = Math.min(G.player.maxHp, G.player.hp + 2);   // every car cleared makes the hero a bit tougher
      buildLevel(); G.cam = isoW(1.5, MID);
      { const th = theme(), looped = G.trans.looped; log(() => looped ? t('loopedLog') : t('entered', { name: th.name }), looped ? '#ff9ad5' : '#9fd2ff'); }
      updateHUD();
    }
    if (G.trans.t <= 0) G.trans = null;
  } else if (G.state === 'play') update(dt);
  for (const ent of [G.player, G.dog, ...G.enemies]) if (ent.lunge) { ent.lunge.t -= dt * 6; if (ent.lunge.t <= 0) ent.lunge = null; }
  for (const f of G.fx) f.t -= dt; G.fx = G.fx.filter(f => f.t > 0);
  for (const q of G.parts) { q.t -= dt; q.a += q.va * dt; q.b += q.vb * dt; q.z += q.vz * dt; q.vz -= 300 * dt; if (q.z < 0) { q.z = 0; q.vz *= -.4; } }
  G.parts = G.parts.filter(q => q.t > 0);
  for (const t of G.texts) t.t -= dt * 1.1; G.texts = G.texts.filter(t => t.t > 0);
  if (G.banner) { const B = G.banner, tx = v => typeof v === 'function' ? v() : v; toast(B.icon, () => tx(B.title)); log(() => `${B.icon} <b>${tx(B.title)}</b>: ${tx(B.sub)}`, '#ffd84d'); G.banner = null; }
  render(dt);
  updateWareBox(); updatePw();
  requestAnimationFrame(frame);
}
setSmall(); newGame(); updateHUD(); document.body.dataset.ov = 'title'; document.body.classList.add('ov');
let firstFrame = null;   // what the very first frame showed (the tests check it is already in the right language)
requestAnimationFrame(now => { frame(now); firstFrame = { lang: LANG(), canvas: drawnText.slice(), html: document.body.innerText }; });
</script>
</body>
