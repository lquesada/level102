function placeVessel(){vessel.style.left=(shp.cx-shp.hw)+"px";vessel.style.top=(shp.cy-shp.hh)+"px";vessel.style.width=(2*shp.hw)+"px";
  vessel.style.height=(2*shp.hh)+"px";vessel.style.borderRadius=shp.r+"px";vessel.style.opacity=SHAPES[shapeI]==="full"&&morphT>=1?.55:1;}
const SHAPE_ICON=["M3.5 3.5h17v17h-17z","M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17z","M6 6h12v12H6z"];
function setShape(i,anim){shapeI=i;store.set("shape",SHAPES[i]);setScale();shpFrom={...shp};shpTo=shapeRect(i);morphT=anim?0:1;if(!anim)shp=shpTo;
  const n=targetN();if(n>N)pourQ=n-N;paintTexts();wake();}
const ease=u=>u<.5?2*u*u:1-(-2*u+2)**2/2;
function morph(dt){if(morphT>=1)return;morphT=Math.min(1,morphT+dt/.55);const u=ease(morphT);
  for(const k of["cx","cy","hw","hh","r"])shp[k]=shpFrom[k]+(shpTo[k]-shpFrom[k])*u;placeVessel();}

/* ================= gravity from the phone ================= */
let FLATT=0,flat=0,RESTE=1.2,lp=null,motionOn=false,motionAsked=false,inv=0,invN=0,invSum=0,lastG=[0,1];
function onMotion(e){const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;gotMotion=true;
  // force felt by the liquid = -(measured specific force); device y points up, screen y down
  let fx=-a.x,fy=a.y;
  if(invN<12&&Math.abs(a.y)>6&&Math.abs(a.x)<4){invSum+=Math.sign(a.y);invN++;if(invN===12)inv=invSum<-6?1:0;}  // some browsers report the opposite sign
  if(inv){fx=-fx;fy=-fy;}
  const ang=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180,c=Math.cos(ang),s=Math.sin(ang);
  const X=fx*c+fy*s,Y=-fx*s+fy*c;     // rotate into the current screen orientation
  // shakes: the quick part of the signal (minus a slow average) is boosted so the liquid sloshes hard
  if(!lp){lp=[X,Y];}lp[0]+=(X-lp[0])*.12;lp[1]+=(Y-lp[1])*.12;
  GX=(lp[0]+(X-lp[0])*2.6)/9.81;GY=(lp[1]+(Y-lp[1])*2.6)/9.81;motionOn=true;
  {const az=Math.abs(a.z||0),al=Math.hypot(a.x,a.y,a.z||0)||1;FLATT=Math.min(1,Math.max(0,(az/al-.45)/.5));}   // phone lying flat -> 1
  if(Math.hypot(GX-lastG[0],GY-lastG[1])>.03){lastG=[GX,GY];wake();}}
let gotMotion=false,blockedTold=false;
function checkMotion(){if(!touchy||blockedTold)return;setTimeout(()=>{if(!gotMotion&&!blockedTold){blockedTold=true;toast(window.isSecureContext===false?t().noSecure:t().noMotion);}},2500);}
function onOrient(e){if(gotMotion||e.beta==null)return;   // fallback when only orientation is available
  const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;let fx=Math.sin(g)*Math.cos(b),fy=Math.sin(b);
  const ang=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180,c=Math.cos(ang),s=Math.sin(ang);
  GX=fx*c+fy*s;GY=-fx*s+fy*c;motionOn=true;if(Math.hypot(GX-lastG[0],GY-lastG[1])>.03){lastG=[GX,GY];wake();}}
function askMotion(){checkMotion();if(motionAsked)return;
  if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(r=>{motionAsked=true;if(r!=="granted"&&!motionOn)toast(t().noMotion);}).catch(()=>{});   // retried on the next tap if not allowed yet
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function")DeviceOrientationEvent.requestPermission().catch(()=>{});}
  else motionAsked=true;}
// listen right away (Android); iPhone only sends events after the permission asked on the first tap
if(typeof DeviceMotionEvent!=="undefined")addEventListener("devicemotion",onMotion);
addEventListener("deviceorientation",onOrient);

/* ================= input ================= */
function ptrPos(e){const r=stage.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
stage.addEventListener("pointerdown",e=>{if(e.target.closest("#tools"))return;askMotion();hideHint();
  const[x,y]=ptrPos(e),taken=new Uint8Array(N);for(const q of ptrs.values())for(let k=0;k<q.n;k++)if(q.grab[k]<N)taken[q.grab[k]]=1;
  const R=HR*3,R2=R*R,M=Math.min(N,Math.max(60,N/8|0)),grab=new Int32Array(M),ox=new Float32Array(M),oy=new Float32Array(M);let n=0;
  for(let i=0;i<N&&n<M;i++){if(taken[i])continue;const rx=PX[i]-x,ry=PY[i]-y;if(rx*rx+ry*ry<R2){grab[n]=i;ox[n]=rx*.7;oy[n]=ry*.7;n++;}}
  if(n<M*.5){ // not on the liquid (or only its edge): grab the nearest drops, they flow to the finger
    const idx=Array.from({length:N},(_,i)=>i).filter(i=>!taken[i]),dd=i=>(PX[i]-x)**2+(PY[i]-y)**2;idx.sort((a,b)=>dd(a)-dd(b));
    n=0;for(const i of idx.slice(0,M)){grab[n]=i;const a=n*2.4,rr=Math.sqrt(n)*S*.55;ox[n]=Math.cos(a)*rr;oy[n]=Math.sin(a)*rr;n++;}}
  ptrs.set(e.pointerId,{x,y,vx:0,vy:0,lx:x,ly:y,lt:performance.now(),grab,ox,oy,n});stage.classList.add("drag");
  try{stage.setPointerCapture(e.pointerId);}catch(_){}wake();});
stage.addEventListener("pointermove",e=>{const ptr=ptrs.get(e.pointerId);if(!ptr)return;const[x,y]=ptrPos(e),now=performance.now(),dt=Math.max(8,now-ptr.lt)/1000;
  ptr.vx=ptr.vx*.4+(x-ptr.lx)/dt*.6;ptr.vy=ptr.vy*.4+(y-ptr.ly)/dt*.6;ptr.x=x;ptr.y=y;ptr.lx=x;ptr.ly=y;ptr.lt=now;wake();});
const endPtr=e=>{if(e.type==="pointerup")askMotion();if(ptrs.delete(e.pointerId)&&!ptrs.size)stage.classList.remove("drag");};
stage.addEventListener("pointerup",endPtr);stage.addEventListener("pointercancel",endPtr);
function shake(){const s=G0*.55;for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2;VX[i]+=Math.cos(a)*s*.35+(Math.random()-.5)*s;VY[i]+=Math.sin(a)*s*.35-s*.6*Math.random();}wake();}
function press(b,fn){b.addEventListener("pointerdown",()=>b.classList.add("press"));b.addEventListener("pointerup",()=>b.classList.remove("press"));
  b.addEventListener("pointerleave",()=>b.classList.remove("press"));b.addEventListener("click",()=>{hideHint();fn();});}
press($("bShape"),()=>setShape((shapeI+1)%SHAPES.length,true));
press($("bColor"),()=>{colorI=(colorI+1)%COLORS.length;store.set("color",colorI);paintTexts();wake();});
press($("bShake"),()=>{askMotion();shake();});
press($("bSpeed"),()=>{SPI=(SPI+1)%SPEEDS.length;store.set("speed3",SPI);setScale();paintTexts();toast(t().speed+" "+$("spdTxt").textContent);wake();});
press($("bAmount"),()=>{AMI=(AMI+1)%AMOUNTS.length;store.set("amount",AMI);const n=targetN();if(n>N)pourQ=n-N;paintTexts();toast($("bAmount").getAttribute("aria-label"));wake();});
let keyG=null;
addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("#l102bar"))return;
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){keyG=m;GX=m[0];GY=m[1];hideHint();wake();e.preventDefault();}
  else if(e.key===" "&&!(e.target.closest&&e.target.closest("button"))){shake();hideHint();e.preventDefault();}});

/* ================= texts, hint, toast ================= */
function paintTexts(){const T=t();document.title=T.name;$("hTitle").textContent=T.name;$("hText").textContent=touchy?T.hintTouch:T.hintMouse;
  stage.setAttribute("aria-label",T.stage);
  const sb=$("bShape"),nx=T.shapes[(shapeI+1)%SHAPES.length];sb.setAttribute("aria-label",T.shape+": "+nx);sb.title=T.shape+": "+nx;
  $("shapeIcon").setAttribute("d",SHAPE_ICON[(shapeI+1)%SHAPES.length]);
  const cb=$("bColor");cb.setAttribute("aria-label",T.color+": "+T.colors[colorI]);cb.title=cb.getAttribute("aria-label");
  $("dropIcon").setAttribute("fill",`rgb(${COLORS[(colorI+1)%COLORS.length][0].join()})`);
  const kb=$("bShake");kb.setAttribute("aria-label",T.shake);kb.title=T.shake;
  const dec=x=>L102.lang==="en"?x:x.replace(".",","),sx_="×"+dec(SPEED_TXT[SPI]);
  const ab=$("bAmount"),al=T.amount+" ×"+dec(AMOUNT_TXT[AMI]);ab.setAttribute("aria-label",al);ab.title=al;const lv=Math.min(1,AMOUNTS[AMI]/1.5);$("amLevel").setAttribute("y",String(21-15*lv));$("spdTxt").textContent=sx_;const sb2=$("bSpeed");sb2.setAttribute("aria-label",T.speed+" "+sx_);sb2.title=sb2.getAttribute("aria-label");
  $("iTitle").textContent=T.name;$("iText").textContent=T.introText;$("iStart").textContent=T.start;$("iFull").textContent=T.startFull;}
let hintT=setTimeout(hideHint,7000);
// phones: a start card first; its tap is the gesture the browser needs to hand over the motion sensor
const canFull=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
if(touchy){$("intro").hidden=false;$("hint").classList.add("off");clearTimeout(hintT);$("iFull").hidden=!canFull;}
function closeIntro(full){askMotion();$("intro").hidden=true;
  if(full){const de=document.documentElement;try{const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
$("iStart").addEventListener("click",()=>closeIntro(false));$("iFull").addEventListener("click",()=>closeIntro(true));
// full screen: keep the screen from rotating (the liquid already follows gravity)
function onFull(){const fs=document.fullscreenElement||document.webkitFullscreenElement,o=screen.orientation;if(!o)return;
  try{if(fs&&o.lock){const p=o.lock(innerHeight>=innerWidth?"portrait-primary":"landscape-primary");if(p&&p.catch)p.catch(()=>{});}else if(!fs&&o.unlock)o.unlock();}catch(e){}}
document.addEventListener("fullscreenchange",onFull);document.addEventListener("webkitfullscreenchange",onFull);
function hideHint(){clearTimeout(hintT);$("hint").classList.add("off");}
let toastT=0;function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),4000);}
addEventListener("l102:lang",paintTexts);

/* ================= main loop (sleeps when the liquid is still) ================= */
const STATS=/[?&]stats\b/.test(location.search);if(STATS)$("stats").hidden=false;
let st={f:0,w:0,t0:performance.now()};
let raf=0,last=0,acc=0,still=0,rt={real:0,lost:0},FL_RT=1;
const perf={frames:0,sum:0,max:0,reset(){this.frames=0;this.sum=0;this.max=0;}};
function wake(){still=0;if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
function frame(now){raf=0;const t0=performance.now(),raw=(now-last)/1000;let dt=Math.min(.05,raw);last=now;const clip=raw<.5?raw-dt:0;   // time a slow frame could not simulate
  // smooth the gravity (phone sensors are noisy; keys switch softly)
  const k=motionOn?1:Math.min(1,dt*7);gx+=(GX-gx)*k;gy+=(GY-gy)*k;   // phone tilt applies at once
  // flat phone: gravity pushes into the screen, so the liquid spreads into a thinner layer (looser + a bit see-through)
  flat+=(FLATT-flat)*Math.min(1,dt*3);RESTE=REST*(1-.5*flat);
  morph(dt);if(pourQ>0)pour();drain();
  acc+=dt;const h=SUB/Math.sqrt(SPM()),cap=Math.ceil(8*Math.sqrt(Math.max(1,SPM())));let n=0;while(acc>=h&&n<cap){step(h);acc-=h;n++;}
  let lost=clip;if(n===cap){lost+=acc;acc=0;}
  // same speed on every phone: if this one can't keep real time, drop some particles until it can
  rt.real+=dt+clip;rt.lost+=lost;if(rt.real>1.5){const ratio=1-rt.lost/rt.real;FL_RT=ratio;if(ratio<.92&&QUAL>.45){QUAL=Math.max(.45,QUAL*.88);setScale();setupField();}rt.real=0;rt.lost=0;}   // keep real-time speed on slower phones
  render();fizz(dt);
  let vm=0;for(let i=0;i<N;i+=3){const v=VX[i]*VX[i]+VY[i]*VY[i];if(v>vm)vm=v;}
  still=vm<(S*1.6)**2&&Math.abs(FLATT-flat)<.02&&!ptrs.size&&morphT>=1&&!pourQ?still+dt:0;
  if(STATS){st.f++;st.w+=performance.now()-t0;const now2=performance.now();if(now2-st.t0>500){const sec=(now2-st.t0)/1000;
    $("stats").textContent=`fps ${(st.f/sec).toFixed(0)}  work ${(st.w/st.f).toFixed(1)}ms\nreal-time ${(FL_RT*100).toFixed(0)}%  particles ${N}\nspeed x${SPEEDS[SPI].toFixed(2)}  g ${G0.toFixed(0)}px/s2\nvessel ${SHAPES[shapeI]} ${W}x${H}  dpr ${devicePixelRatio}`;st.f=0;st.w=0;st.t0=now2;}}
  const ft=performance.now()-t0;perf.frames++;perf.sum+=ft;if(ft>perf.max)perf.max=ft;
  if(still<1.2)raf=requestAnimationFrame(frame);}
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else wake();});

/* ================= layout ================= */
function layout(){const r=stage.getBoundingClientRect(),oW=W,oH=H;W=Math.round(r.width);H=Math.round(r.height);if(W<10||H<10)return;
  const first=!oW;setScale();setupField();setupFizz();
  if(first){shp=shapeRect(shapeI);spawnBlock(targetN());}
  else{const sx=W/oW,sy=H/oH;for(let i=0;i<N;i++){PX[i]*=sx;PY[i]*=sy;}shp=shapeRect(shapeI);shpTo=shp;morphT=1;
    const n=targetN();if(n>N)pourQ=n-N;}
  placeVessel();wake();}
addEventListener("resize",layout);
paintTexts();layout();

/* test hooks */
window.FL={flat:()=>flat,amount:()=>AMOUNTS[AMI],realtime:()=>FL_RT,qual:()=>QUAL,speed:()=>SPEEDS[SPI],pos:i=>[PX[i],PY[i]],tune(o){if('sub' in o)SUB=o.sub;if('g' in o)GM=o.g;if('rest' in o)RESTF=o.rest;if('k' in o)KF=o.k;if('kn' in o)KNF=o.kn;if('vs' in o)VS=o.vs;setScale();},avgSpeed(){let v=0;for(let i=0;i<N;i++)v+=Math.hypot(VX[i],VY[i]);return v/N;},get n(){return N;},target:targetN,shape:()=>SHAPES[shapeI],color:()=>colorI,perf,
  com(){let x=0,y=0;for(let i=0;i<N;i++){x+=PX[i];y+=PY[i];}return[x/N,y/N];},
  outside(m){let c=0;for(let i=0;i<N;i++)if(sdf(PX[i],PY[i])>(m||2))c++;return c;},
  gravity:()=>[gx,gy],running:()=>!!raf,maxSpeed(){let v=0;for(let i=0;i<N;i++)v=Math.max(v,Math.hypot(VX[i],VY[i]));return v;},
  density(){let s=0;for(let i=0;i<N;i++)s+=RHO[i];return s/N;},S:()=>S,HR:()=>HR,shp:()=>({...shp}),size:()=>[W,H]};
</script>
