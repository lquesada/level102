<style>

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}

body{

}

svg{display:block}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto;

/* The page IS the machine: a glossy body, the touch screen set into it on top, the serving bay below. */

  background:linear-gradient(90deg,rgba(0,0,0,.06),transparent 6%,transparent 94%,rgba(0,0,0,.08)),linear-gradient(180deg,#fffdfb 0%,#ffeef6 55%,#ffd9ec 100%);

  display:grid;gap:10px;grid-template-rows:auto minmax(0,1fr) minmax(170px,calc(35% - (var(--fs) - 1) * 30%));grid-template-columns:minmax(0,1fr);transition:grid-template-rows .45s ease}

// a long list on the order receipt: the first few names, then "+ N more" (the recipe card lists everything)

function mixText(o){const P=PRODUCTS[o.product], L2=LEVEL2[P.l2];const parts=[];

  return parts.join(" · ");}

/* ================= actions ================= */
function nope(id){const el=document.querySelector('[data-id="'+id+'"]');if(el){el.classList.remove("nope");void el.offsetWidth;el.classList.add("nope");}Snd.nope();}
function act(a,id,el){
  if(a==="product"){setProduct(id);lastPicked=id;Snd.select();}
  else if(a==="flavour"){const i=order.flavours.indexOf(id);
    if(i>=0)order.flavours.splice(i,1);
    else{order.flavours.push(id);lastPicked=id;Snd.select();}
    if(order.flavours.length<2)order.mix="layers";}
  else if(a==="unflavour"){order.flavours=order.flavours.filter(f=>f!==id);if(order.flavours.length<2)order.mix="layers";}
  else if(a==="cat"){cat=id;renderPane(false);return;}
  else if(a==="tcat"){tcat=id;renderPane(false);return;}
  else if(a==="sugar"){order.sugar=+id;}
  else if(a==="l2"){order.l2=+id;}
  else if(a==="size"){order.size=id;}
  else if(a==="mix"){order.mix=id;}
  else if(a==="sweet"){const l=sweetList(order), i=l.indexOf(id);if(i>=0){if(l.length===1){nope(id);return;}l.splice(i,1);}else l.push(id);order.sweet=l.sort((x,y)=>SW_IDX[x]-SW_IDX[y]).join(",");lastPicked=id;Snd.select();}
  else if(a==="base"){order.base=id;}
  else if(a==="ice"){order.ice=+id;}
  else if(a==="icetype"){order.iceType=id;}
  else if(a==="sour"){order.sour=+id;}
  else if(a==="spicy"){order.spicy=+id;}
  else if(a==="salty"){order.salty=+id;}
  else if(a==="popc"){order.popc=+id;}
  else if(a==="rim"){order.rim=id;}

    document.body.appendChild(a);a.click();a.remove();msg.textContent=i18n("picSaved");Snd.select();}catch(e){fail();}},fail);});
$("#shareClose").addEventListener("click",closeShare);
$("#shareDlg").addEventListener("click",e=>{if(e.target===$("#shareDlg"))closeShare();});
$("#shareUrl").addEventListener("focus",e=>e.target.select());
// test hook (used by the automated checks; harmless for players)
window.DrinkMixer={encode,decode,fillInventory(n){const r=rng(42);for(let i=0;i<n;i++){const pid=PRODUCT_ORDER[Math.floor(r()*7)];const o=freshState(pid);
    const fl=FLAVOURS.filter(f=>allowedFl(f,o));o.flavours=[0,1,2].slice(0,1+Math.floor(r()*3)).map(()=>fl[Math.floor(r()*fl.length)].id).filter((v,j,a)=>a.indexOf(v)===j);
    const tl=TOPPINGS.filter(t=>allowedTo(t,o));o.toppings=[0,1,2,3].slice(0,Math.floor(r()*5)).map(()=>tl[Math.floor(r()*tl.length)].id).filter((v,j,a)=>a.indexOf(v)===j);
    o.boosts=BOOSTS.filter(()=>r()<.08).slice(0,4).map(b=>b.id);o.sugar=Math.floor(r()*6);o.mix=o.flavours.length>1?MIXES[Math.floor(r()*5)][0]:"layers";
    const pk=a=>a[Math.floor(r()*a.length)];o.base=r()<.4?pk(BASES)[0]:"auto";o.iceType=pk(ICE_TYPES)[0];o.ice=Math.floor(r()*4);o.rim=r()<.3?pk(RIMS)[0]:"none";
    o.sour=r()<.15?1+Math.floor(r()*3):0;o.spicy=r()<.1?1+Math.floor(r()*4):0;o.popc=r()<.15?1:0;
    Inv.serial++;Inv.items.push([encode(o),Math.floor(Date.now()/1000)-i*60,Inv.serial]);}Inv.persist();paintInvCount();},
  state:()=>({phase,step,order:encode(order),inv:Inv.items.length,name:orderName,fromLink}),
  picture:(code,title)=>picFor(code,title).promise.then(q=>q.blob),
  link:(code,name)=>shareLink(code==null?encode(order):code,name),
  renderTest(code){const o=decode(code);const g=document.createElementNS(NS,"g");const sc=buildScene(o,g,{});for(let T=0;T<sc.duration+.5;T+=.25)sc.update(T,T);sc.update(Infinity,3);return{d:sc.duration,nodes:g.querySelectorAll("*").length,code:encode(o)};},
  setOrder(code){order=decode(code);step=6;toPhase("choose");return encode(order);}};

/* ================= after serving: drink it / wash it down the sink ================= */
function renderOutroPane(){
  const soft=PRODUCTS[order.product].soft, kind=outro.kind;
  $("#pane").innerHTML='<div class="ticket"><div class="big">'+i18n(kind==="drink"?(soft?"nom":"glug"):"sink")+'</div><div class="ln">'+i18n(soft?"cleanCone":"cleanGlass")+'</div></div>';
  updateCaption(i18n(kind==="drink"?"yum":"washing"));
}
function startOutro(kind){
  if(phase!=="served")return;
  phase="outro";outro={kind,start:performance.now(),dur:reduced()?.5:(kind==="drink"?2.4:1.7),slurped:false};
  $("#rays").setAttribute("opacity",0);$("#confetti").textContent="";
  renderOutroPane();
  if(kind==="reset"){$("#dyn").setAttribute("clip-path","url(#sinkClip)");Snd.noise(1.2,400,.07);}
}
function runOutro(now,clk){
  const p=clamp((now-outro.start)/1000/outro.dur,0,1), dyn=$("#dyn");
  if(outro.kind==="drink"){
    if(reduced()){dyn.setAttribute("opacity",1-p);}
    else{
      if(!outro.masked&&scene){outro.masked=true;const top=scene.cupTop();
        outro.top=top-45;outro.bot=BASE+8;outro.kept=scene.eatMask();}
      const a=easeOut(clamp(p/.25,0,1)), z=1+1.1*a;
      const q=clamp((p-.25)/.6,0,1), y=lerp(outro.top,outro.bot,q*q*(3-2*q));if(scene)scene.drain(q*q*(3-2*q));
      $("#gEat").setAttribute("y1",y);$("#gEat").setAttribute("y2",y+40);
      if(p>.25&&!outro.slurped){outro.slurped=true;Snd.slurp();setTimeout(()=>Snd.slurp(),500);}
      const fade=1-clamp((p-.88)/.12,0,1);
      dyn.setAttribute("transform","translate(150 230) scale("+z+") translate(-150 "+(-230+a*28)+")");
      scene.glass().forEach(e=>{e.style.opacity=fade;});(outro.kept||[]).forEach(e=>{e.style.opacity=fade;});
    }
  } else {
    const o=clamp(p/.25,0,1), q=clamp((p-.2)/.65,0,1), e=q*q;
    $("#sink").setAttribute("rx",o*(1-clamp((p-.85)/.15,0,1))*62);$("#sink").setAttribute("ry",o*(1-clamp((p-.85)/.15,0,1))*7);
    $("#sinkSwirl").setAttribute("opacity",o*(1-clamp((p-.85)/.15,0,1)));$("#sinkSwirl").setAttribute("transform","rotate("+(clk*400%360)+" 150 340) translate(0 0)");
    dyn.setAttribute("transform","translate(0 "+(e*300)+") rotate("+(Math.sin(q*12)*3)+" 150 332)");
  }
  if(scene)scene.update(Infinity,clk);
  if(p>=1)newGlass();
}
function newGlass(){
  $("#gEat").setAttribute("y1",-60);$("#gEat").setAttribute("y2",-20);
  const dyn=$("#dyn");dyn.removeAttribute("transform");dyn.removeAttribute("opacity");dyn.removeAttribute("clip-path");
  $("#sink").setAttribute("rx",0);$("#sink").setAttribute("ry",0);$("#sinkSwirl").setAttribute("opacity",0);
  outro=null;sip=1;order=freshState(order.product);step=0;orderName="";fromLink=false;
  introStart=reduced()?0:performance.now();
  toPhase("choose");Snd.pop();
}

/* ================= main loop ================= */
let lastFrame=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  const clk=reduced()?0:(now-t0)/1000;
  if(phase==="outro"&&outro){runOutro(now,clk);return;}
  if(introStart&&scene){const T=(now-introStart)/1000;if(T<.7){scene.update(T,clk);return;}introStart=0;}
  if(phase==="pour"&&pourInfo){
    const T=(now-pourInfo.start)/1000*pourInfo.speed, sc=pourInfo.scene;
    sc.update(Math.min(T,sc.duration),clk);
    // events: sounds + checklist
    const lis=document.querySelectorAll("#plist li");
    let cur=null;
    sc.events.forEach((e,i)=>{const li=lis[i];if(!li)return;
      if(T>=e.start&&!pourInfo.fired.has(i)){pourInfo.fired.add(i);if(e.snd==="pour")Snd.pour(Math.min(1.2,e.dur/pourInfo.speed));else if(e.snd)Snd[e.snd]();
        li.classList.add("on");li.scrollIntoView({block:"nearest"});}
      if(T>=e.start+e.dur&&!pourInfo.done.has(i)){pourInfo.done.add(i);li.classList.remove("on");li.classList.add("ok");li.querySelector(".st").innerHTML=ICON_CHECK;}
      if(T>=e.start&&T<e.start+e.dur&&!e.par)cur=e;});
    if(cur)updateCaption(cur.label+"...");
    // lamps
    ["#lamp0","#lamp1","#lamp2"].forEach((l,i)=>$(l).setAttribute("opacity",.35+.65*(Math.floor(clk*6+i)%3===0?1:0)));
    if(T>=sc.duration){pourInfo=null;["#lamp0","#lamp1","#lamp2"].forEach(l=>$(l).setAttribute("opacity",1));serve();}
    return;
  }
  if(reduced())return;
  if(now-lastFrame<33)return; lastFrame=now; // idle animation ~30 fps
  if(scene)scene.update(Infinity,clk);
  if(phase==="served"){$("#rays").setAttribute("transform","rotate("+(clk*8%360)+" 150 220)");}
}

/* ================= boot ================= */
// static texts in the HTML are empty in the source and filled here, in the same run as the first render (no English flash)
function paintStatic(){
  document.title=i18n("title");
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=i18n(e.dataset.t);});
  document.querySelectorAll("[data-ta]").forEach(e=>{e.setAttribute("aria-label",i18n(e.dataset.ta));});
}
// language switched in the top bar: re-render everything in place, keeping the order, phase, collection and scroll
function relocalise(){
  applyLang();paintStatic();paintSound();paintInvCount();
  $("#toast").classList.remove("show");$("#toast").textContent="";$("#copyMsg").textContent="";
  renderSteps();renderBar();
  if(phase==="choose"){renderPane(true);updateCaption();}
  else if(phase==="pour"&&pourInfo){
    const fresh=buildScene(order,document.createElementNS(NS,"g"),{}).events; // same recipe -> same events, new labels
    pourInfo.scene.events.forEach((e,i)=>{if(fresh[i])e.label=fresh[i].label;});
    const y=$("#paneWrap").scrollTop;renderPourPane();$("#paneWrap").scrollTop=y;updateCaption(i18n("pouringCap",{x:nameOf(order,orderName)}));
  }
  else if(phase==="served"){const y=$("#paneWrap").scrollTop;renderServed();$("#paneWrap").scrollTop=y;updateCaption(i18n("readyCap",{n:servedNo}));}
  else if(phase==="outro"&&outro)renderOutroPane();
  if(!$("#inv").hidden){
    if(V.detailNo!==null){const c=V.confirming,y=$("#invDetail").scrollTop;showDetail(V.detailNo);V.confirming=c;$("#detailActions").innerHTML=detailButtons();$("#invDetail").scrollTop=y;}
    else{showGrid();layoutGrid(true);}
  }
}
addEventListener("l102:lang",relocalise);
addEventListener("l102:fs",()=>{if(!$("#inv").hidden&&V.detailNo===null)layoutGrid(true);});
applyLang();paintStatic();
let linkBad=false;
(()=>{let d=null;try{d=new URLSearchParams(location.search).get("d");}catch(e){}if(d===null)return;
  const r=readLink(d);if(!r){linkBad=true;return;}order=r.order;orderName=r.name;fromLink=true;step=6;})();
Inv.load();paintInvCount();paintSound();renderAll(false);refreshScene();requestAnimationFrame(frame);
if(linkBad)toast(i18n("linkBad"));else if(fromLink)toast(i18n("friendDrink",{x:nameOf(order,orderName)}));
if(reduceMQ.addEventListener)reduceMQ.addEventListener("change",()=>{if(scene)scene.update(Infinity,0);});
</script>
