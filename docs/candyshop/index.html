function h2r(h){h=h.slice(1);if(h.length<6)h=[...h].map(x=>x+x).join("");const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}

function shape(c,path,col,o={}){c.beginPath();path();c.lineJoin="round";c.lineCap="round";c.lineWidth=o.ol??.13;c.strokeStyle=o.olc||dk(col,.42);c.stroke();

function dots(c,n,rx,ry,col,s,seed,cx=0,cy=0){const R=rng(seed);c.fillStyle=col;c.beginPath();for(let i=0;i<n;i++){const a=R()*P2,d=Math.sqrt(R()),r=s*(.6+R()*.7);

K("toffee",["Wrapped toffees","Caramelos de tofe","Sahne­bonbons"],{r:.55,h:.62,s:M,p:15,v:["#e8b13a","#e2333f","#7a3bd1","#2fae5b","#2f7de1"]},(c,col)=>{

const bounce=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375;};

      ctx.lineWidth=4;ctx.strokeStyle="#fff";const y=p.y-p.t*30;ctx.strokeText(t("oops"),p.x,y);ctx.fillStyle="#d81b60";ctx.fillText(t("oops"),p.x,y);}ctx.globalAlpha=1;}

/* ================= main loop ================= */
let raf=0,last=0,acc=0;

function busy(){if(flights.length||pops.length||rainQ.length||animIn||animDrop||badgeT>0||contPress>0||Math.abs(svel)>2||starget!==null||ptr&&ptr.drag)return true;
  for(const b of bodies)if(!b.zz||b.fade)return true;return false;}
function fxBusy(){if(fxDirty||flights.length||pops.length||rainQ.length||animIn||animDrop||badgeT>0||contPress>0||phase==="counter"||phase==="done")return true;
  for(const b of bodies)if(!b.zz||b.fade)return true;return false;}

    else if(b.zone==="free"&&(b.y>GH+200||b.x<-300||b.x>GW+300))bodies.splice(i,1);}
  if(phase==="shop")placeCont();}

function binCenter(i){const cv=binEls[i].cv.getBoundingClientRect(),g=game.getBoundingClientRect();return[cv.left+cv.width/2-g.left,cv.top+cv.height/2-g.top,cv.width];}

  if(GEO&&bag.length&&bag.every(e=>e.b&&e.b.zone==="in"))o.p=bag.map(e=>{const r=relPos(e.b,GEO);return[Math.round(r[0]*1000),Math.round(r[1]*1000),Math.round(r[2]*100)];});

window.CS={get phase(){return phase;},get ct(){return CT;},bag:()=>bag.map(e=>e.k),count:()=>bag.length,total,wallet:()=>wallet.slice(),tray:()=>trayVals(),
  kinds:()=>KINDS.map(k=>({id:k.id,n:k.n,p:k.p,s:k.s,vars:k.v.length})),geo:()=>GEO&&{cx:GEO.cx,by:GEO.by,W:GEO.W,H:GEO.H,rimY:GEO.rimY,extTop:GEO.extTop,ib:GEO.ib},U:()=>U,FY:()=>FY,
  sx:()=>sx,maxS:()=>maxS,perf,flights:()=>flights.length,
  inside(){const G=GEO;if(!G)return{ok:true,bad:[]};const bad=[];for(const b of bodies){if(b.zone!=="in")continue;
    const ok=isFinite(b.x)&&isFinite(b.y)&&b.y<=G.ib+1&&(b.y<G.extTop||b.x>=wallX(G,b.y,-1)-1&&b.x<=wallX(G,b.y,1)+1);if(!ok)bad.push([b.k,Math.round(b.x),Math.round(b.y)]);}
    const linked=bag.every(e=>!e.b||bodies.includes(e.b));return{ok:!bad.length&&linked,bad,n:bodies.filter(b=>b.zone==="in").length};},
  falling:()=>bodies.filter(b=>b.zone==="free").map(b=>({k:b.k,x:b.x,y:b.y})).concat(flights.filter(f=>f.mode!=="in").map(f=>({k:f.k,flying:1}))),
  asleep:()=>bodies.filter(b=>b.zone==="in"&&b.zz).length,
  add:(i)=>addCandy(i),eject:()=>ejectLast(),finish(){for(let i=0;i<200&&(flights.length||rainQ.length||animIn);i++)update(1/60);settle(240);render();},
  binIndex:id=>KINDS.findIndex(k=>k.id===id),lastPay:()=>lastPay,denoms:DENOMS,makeChange,
  drawAll(){const c=document.createElement("canvas").getContext("2d");let n=0;for(const k of KINDS)for(let v=0;v<k.v.length;v++){c.save();k.d(c,k.v[v],v);c.restore();n++;}return n;},
  moveMoneyByValue(c,toTray){const m=(toTray?walletI:trayI).find(m=>m.c===c);if(m)moveMoney(m.id,toTray);return!!m;}};
Object.assign(window.CS,{inv:()=>invLoad(),invReload(){inv=null;return invLoad().length;},openColl,closeColl,openView,closeView,save:doSave,edit:i=>editItem(invLoad()[i]),rel:()=>bag.map(e=>e.b&&e.b.zone==="in"?relPos(e.b,GEO):null),itemCandies:i=>itemCandies(invLoad()[i]).map(([K,v,x,y,a])=>[K.id,v,x,y,a]),
  snap:()=>{const it=snapItem("",0);return it&&itemCandies(it).map(([K])=>K.id);},picture:i=>renderPicture(invLoad()[i]).toDataURL("image/png"),share:i=>shareItem(i===undefined?doneItem():invLoad()[i]),genName,secs:()=>SECS.map(s=>s[0])});
</script>
</body>
</html>
