const echoJobs=[];

let echoBudget=4, otherWorkEMA=2;

}

const SIGN_L=0.5, SIGN_H=0.16, SIGN_T=0.04;
function revealSign(s, appear){
  const GR=[0.25,1,0.4], ux=s.dx, uz=s.dz, nx=-uz, nz=ux;
  const P=(x,y,z,b)=>pushPt(x+(Math.random()-.5)*0.006,y+(Math.random()-.5)*0.006,z+(Math.random()-.5)*0.006,GR[0]*b,GR[1]*b,GR[2]*b,appear+Math.random()*0.02,1.5,0);

    const fnx=nx*side, fnz=nz*side, rx=fnz, rz=-fnx;            // this face's normal and its reader's right
    const ox=s.x+fnx*(SIGN_T+0.006), oz=s.z+fnz*(SIGN_T+0.006);
    const ar=(ux*rx+uz*rz)>0?1:-1;                                // world exit dir is to reader's right(+1) or left(-1)
    const tu0=ar>0?-0.47:-0.205, cu=ar>0?0.33:-0.33;

    for(const [c,r] of EXIT_TXT.px) for(let k=0;k<4;k++) F(tu0+(c+Math.random())*ps, -0.11+(r+Math.random())*ps, 1.3);
    const tip=cu+0.12*ar;

    for(const sg of [-1,1]) for(let k=0;k<14;k++){ const t=k/13; F(tip-0.085*ar*t, 0.075*sg*t, 1.4); }

  const C=(a,v,n)=>[s.x+ux*SIGN_L*a+nx*SIGN_T*n, s.y+SIGN_H*v, s.z+uz*SIGN_L*a+nz*SIGN_T*n];
  const E=(A,B,n)=>{ for(let k=0;k<n;k++){ const t=Math.random(); P(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t,0.55); } };

// can you see any part of it? the chest first (cheap), then head, hands, elbows, knees, feet... a hand sticking out
// past a corner counts. The parts that are behind walls are hidden by the depth pass when drawn.
function seesMonster(m){
  if(los(player.x,camY,player.z,m.x,1.4,m.z)) return true;
  const P=poseOf(m), h=P.head;
  if(los(player.x,camY,player.z,h[0],h[1],h[2])) return true;
  for(const sg of P.segs) for(const q of [sg[0],sg[1]]) if(los(player.x,camY,player.z,q[0],Math.max(0.05,q[1]),q[2])) return true;
  return false;

function sampleMonster(m,n,appear,life,col,flags){
  const P=poseOf(m); const segs=P.segs;
  let tot=0; const w=segs.map(([a,b,r])=>{const l=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]); tot+=l*(r+0.03); return tot;});
  const nb=Math.floor(n*0.68);
  for(let i=0;i<nb;i++){
    const q=Math.random()*tot; let k=0; while(w[k]<q) k++;
    const [a,b,r]=segs[k]; const t=Math.random();
    let ax=b[0]-a[0],ay=b[1]-a[1],az=b[2]-a[2]; const al=Math.hypot(ax,ay,az)||1; ax/=al;ay/=al;az/=al;
    let vx=Math.random()-.5,vy=Math.random()-.5,vz=Math.random()-.5; const dp=vx*ax+vy*ay+vz*az; vx-=ax*dp;vy-=ay*dp;vz-=az*dp;
    const vl=Math.hypot(vx,vy,vz)||1; const rr=r*(0.85+Math.random()*0.3)/vl;
    const br=0.6+Math.random()*0.5;
    pushPt(a[0]+(b[0]-a[0])*t+vx*rr, a[1]+(b[1]-a[1])*t+vy*rr, a[2]+(b[2]-a[2])*t+vz*rr, col[0]*br,col[1]*br,col[2]*br, appear+Math.random()*0.01, life, flags);
  }
  const h=P.head,F=P.HF,Rr=P.HR,U=P.HU, jaw=m.jaw;
  const at=(o,a,b,c)=>[o[0]+Rr[0]*a+U[0]*b+F[0]*c, o[1]+Rr[1]*a+U[1]*b+F[1]*c, o[2]+Rr[2]*a+U[2]*b+F[2]*c];
  const jc=at(h,0,-0.09-jaw*0.12,0.03+jaw*0.05);

  for(let i=0;i<nh;i++){
    let x=Math.random()-.5,y=Math.random()-.5,z=Math.random()-.5; const l=Math.hypot(x,y,z)||1; x/=l;y/=l;z/=l;
    const sel=Math.random(); let p, br=0.6+Math.random()*0.5, c=col;
    if(sel<0.6){ if(jaw>0.15&&z>0.2&&y<0.15) continue; p=at(h,x*0.11,y*0.16+0.03,z*0.13); }
    else if(sel<0.82){ if(y>0.35) continue; p=at(jc,x*0.09,y*0.05,z*0.11); }
    else { if(jaw<0.15) continue; const a=(Math.random()-.5)*2.4, up=Math.random()<.5, tl=Math.random();

}

  let cur=ci, goal=-1;
  for(let s=0;s<8;s++){ let best=cur,bd=d[cur];
    for(const o of [1,-1,W,-W]){ const n=cur+o; if(n>=0&&n<W*H&&d[n]>=0&&d[n]<bd&&!(avoid&&mat[n]===1)){bd=d[n];best=n;} }
    if(best===cur) break; cur=best;
    const gx=cur%W+0.5,gz=((cur/W)|0)+0.5;
    if(goal<0||clearPath(m.x,m.z,gx,gz,avoid)) goal=cur; else break; }
  if(goal<0) return avoid?null:[dx/dl,dz/dl];
  dx=goal%W+0.5-m.x; dz=((goal/W)|0)+0.5-m.z; const l=Math.hypot(dx,dz)||1; return [dx/l,dz/l];
}

function enterAlert(m,x,z){ if(m.state==='hunt'||m.state==='kill') return; const was=m.state; m.state='alert'; m.target={x,z}; m.lingerT=0; m.freezeT=R(0.3,0.9);
  if(was==='idle') sfxChitter([m.x,1.8,m.z],0.9); }
// enterHunt(m): it heard/sensed you itself -> knows where you are now and which way you were going.
// enterHunt(m,pos,t): told by another monster's scream or by the level's heat -> only that (maybe stale) spot, no heading;
// ignored by a hunter that already has fresher information. Nothing ever hands them your live position: hiding works.
function enterHunt(m,pos,t){ if(m.state==='kill') return;
  if(pos&&m.state==='hunt'&&m.heardT>=t) return;
  if(m.state!=='hunt'){ m.state='hunt'; m.windup=1.0; m.wShriek=true; m.shriekT=R(1.6,3.2); m.freezeT=0; }
  m.overshot=false;
  if(pos){ m.heardT=t; m.lastKnown={x:pos.x,z:pos.z}; m.lastDir=null; return; }
  m.heardT=now; m.lastKnown={x:player.x,z:player.z}; noteHeard();
  const v=Math.hypot(player.vx||0,player.vz||0); m.lastDir=v>0.6?{x:player.vx/v,z:player.vz/v}:null; }
// the last time and place any monster actually heard or sensed you (what the level's "heat" can know)
let lastNoise={x:0,z:0,t:-99};
function noteHeard(){ lastNoise={x:player.x,z:player.z,t:now}; }

// sound the player made at (x,z): kind 'echo' or 'step'
// Sounds the player makes have a power that falls off with distance (walls muffle).
// faint -> curious (walks toward the sound); clear, or several in a row -> shriek & chase.
function hearPlayer(kind){
  for(const m of monsters){ if(m.state==='kill') continue;
    const d=Math.hypot(m.x-player.x,m.z-player.z); if(d>45) continue;
    const eff=d*(los(player.x,EYE,player.z,m.x,1.5,m.z)?1:1.7);
    const pm=matAt(player.x,player.z); const e2=eff*(pm===1?0.75:pm===2?(kind==='step'?1.6:1.25):1); // reverb carries, carpet muffles
    const P=kind==='echo'?1/(1+(e2/8)**2):0.6*(1+fatigue)/(1+(e2/6.5)**2); // exhausted = stumbling, louder
    if(P<0.05) continue;
    noteHeard();
    if(m.state==='hunt'){ enterHunt(m); continue; } // keeps tracking you
    m.susp+=P;
    if(P>=0.5||m.susp>=1.0) enterHunt(m);
    else if(P>=0.15||m.susp>=0.35) enterAlert(m,player.x,player.z);
  }
}

let frameNo=0, shriekFrame=-1;
function shriek(m){
  if(shriekFrame===frameNo) return false; shriekFrame=frameNo; // one shriek per frame: a chorus gets staggered, no frame spike
  const hx=m.x, hz=m.z, hy=1.8;
  const dur=clamp(2.2+(m.chaseT||0)*0.12,2.2,6);
  m.shriekNode=sfxShriek([hx,hy,hz],2.6+heat*1.5,dur); m.shriekLeft=dur; m.shriekPulseT=0.45; heat=Math.min(1,heat+0.05);
  emitEcho({x:hx,y:hy,z:hz,n:13000,maxD:45,speed:30,life:1.9,flags:0,col:[1,0.12,0.08],I:1.45,skip:m});
  emitEcho({x:player.x,y:EYE,z:player.z,n:3500,maxD:30,speed:30,life:1.5,flags:F_NOISY,col:[0.7,0.05,0.08],I:0.8,ax:hx,ay:hy,az:hz});
  const d=Math.hypot(player.x-hx,player.z-hz);
  if(seesMonster(m)) sampleMonster(m,520,now+d/30,1.8,[1,0.3,0.25],F_NOISY|F_BIG);
  staticBoost=Math.max(staticBoost,clamp(1.2-d/35,0.35,1));
  // the scream calls the others to where THIS one thinks you are (not where you really are)
  const lk=m.lastKnown||{x:hx,z:hz}, lt=m.heardT||now;
  const callR=28+heat*45; for(const o of monsters){ if(o===m||o.state==='kill') continue; const dd=Math.hypot(o.x-hx,o.z-hz); if(dd<callR) enterHunt(o,lk,lt); else if(dd<callR*1.7) enterAlert(o,lk.x,lk.z); }
}
// while it keeps screaming, the scream keeps flooding the area with echo
function shriekPulse(m){
  emitEcho({x:m.x,y:1.8,z:m.z,n:6500,maxD:42,speed:30,life:1.1,flags:0,col:[1,0.12,0.08],I:1.25,skip:m});
  const d=Math.hypot(player.x-m.x,player.z-m.z);
  if(seesMonster(m)) sampleMonster(m,260,now+d/30,0.8,[1,0.3,0.25],F_NOISY|F_BIG);
  staticBoost=Math.max(staticBoost,clamp(1-d/40,0.15,0.6));
}
function monsterStep(m){
  const fx=Math.sin(m.yaw),fz=Math.cos(m.yaw);
  const x=m.x+fx*0.3, z=m.z+fz*0.3;
  emitEcho({x,y:0.25,z,n:420,maxD:9,speed:16,life:0.9,flags:0,col:[1,0.32,0.12],I:0.9,skip:m});
  const d=Math.hypot(player.x-x,player.z-z);
  if(seesMonster(m)) sampleMonster(m,170,now+d/40,0.55,[1,0.45,0.32],F_BIG);
  sfxThump([x,0.1,z],0.9);
}

function updateMonster(m,dt){
  m.susp=Math.max(0,m.susp-dt*0.22);
  if(m.state==='hunt') m.chaseT=(m.chaseT||0)+dt; else m.chaseT=Math.max(0,(m.chaseT||0)-dt*2); // a quick re-acquire keeps the long screams
  if(m.shriekLeft>0){ m.shriekLeft-=dt; if(m.shriekNode&&(frameNo&1)){ spatial(m.shriekNode,m.x,1.8,m.z); spatial(m.shriekNode._rb,m.x,1.8,m.z); } // the scream moves with it, and turns with you
    m.shriekPulseT-=dt; if(m.shriekPulseT<=0&&m.shriekLeft>0.2){ m.shriekPulseT=0.45; shriekPulse(m); } }
  // its own echolocation: red dots splash on whatever surfaces around it you can see
  m.echoT-=dt; if(m.echoT<=0){ const st=m.state, running=m.curSpeed>1.6, walking=m.curSpeed>0.2;
    m.echoT=running?R(0.15,0.3):walking?R(0.35,0.7):st==='hunt'?R(0.6,1.2):st==='alert'?R(0.9,1.8):R(1.2,2.5);
    const d=Math.hypot(player.x-m.x,player.z-m.z);
    if(d<60){
      emitEcho({x:m.x,y:1.9,z:m.z,n:running?1300:walking?1600:2600,maxD:running?18:st==='idle'?22:26,speed:24,life:running?0.8:1.2,flags:0,col:[1,0.13,0.08],I:1.15,skip:m});
      // you only see its body when it is in your direct line of sight
      if(seesMonster(m)) sampleMonster(m,running?220:320,now+d/50,running?0.6:1.0,[1,0.5,0.4],F_BIG);
      sfxMonClick([m.x,1.9,m.z],(st==='idle'?0.35:0.6)*(running?0.6:1));
      const ER=running?18:st==='idle'?22:26; let seen=false;
      if(d<ER&&los(m.x,1.9,m.z,player.x,1.3,player.z)){ const pw=Math.min(1.6,(player.spd||0)/2.4)*(1-d/ER); seen=pw>0.22; }
      if(st==='hunt'){ if(seen) enterHunt(m); }
      else if(seen){ m.spotN=(m.spotN||0)+1; if(m.spotN>=2){ m.spotN=0; enterHunt(m); } else enterAlert(m,player.x,player.z); }
      else m.spotN=0; } }
  // twitchy sample-and-hold
  m.twT-=dt; if(m.twT<=0){ m.twX=(Math.random()-.5)*(Math.random()<.3?4:1.2); m.twRoll=Math.random()<.25?MR(-1.6,1.6):MR(-0.3,0.3);
    for(const a of m.armJ){a[0]=MR(-.12,.12);a[1]=MR(-.15,.15);a[2]=MR(-.12,.12);} m.twT=m.state==='hunt'?MR(0.04,0.2):MR(0.1,0.8); }
  let tx=null,tz=null,spd=0;
  if(m.state==='idle'){
    m.wanderT-=dt;
    if(m.wanderT<=0){ if(Math.random()<.2){ m.target=null; } else { for(let t=0;t<30;t++){ const x=Math.floor(m.x)+RI(-14,14),z=Math.floor(m.z)+RI(-14,14); if(inb(x,z)&&walk[idx(x,z)]&&mat[idx(x,z)]!==1){m.target={x:x+.5,z:z+.5};break;} } } m.wanderT=R(5,12); }
    if(m.target){ tx=m.target.x;tz=m.target.z;spd=0.6; if(Math.hypot(tx-m.x,tz-m.z)<0.5) m.target=null; }
    m.chitterT-=dt; if(m.chitterT<=0){ m.chitterT=R(5,12); if(Math.hypot(player.x-m.x,player.z-m.z)<13) sfxChitter([m.x,1.8,m.z],0.35); }
  } else if(m.state==='alert'){
    tx=m.target.x;tz=m.target.z;spd=0.88;
    if(Math.hypot(tx-m.x,tz-m.z)<0.8){ spd=0; m.lingerT+=dt; if(m.lingerT>5){ m.state='idle'; m.target=null; m.wanderT=R(1,3);} }
    if(Math.hypot(player.x-m.x,player.z-m.z)<2.2&&playerMoving) enterHunt(m);
  } else if(m.state==='hunt'){
    // it only knows where you were when it last heard/sensed you (no live tracking)
    if(!m.lastKnown) m.lastKnown={x:m.x,z:m.z};
    tx=m.lastKnown.x; tz=m.lastKnown.z;
    spd=2.87*(0.85+0.25*Math.max(0,Math.sin(now*2.3+m.seed)));
    if(m.windup>0){ // rears up, faces you and screams for ~1s before it charges
      if(m.wShriek&&shriek(m)!==false){ m.wShriek=false; m.shriekT=Math.max(0.3,m.shriekLeft-0.25); }
      m.windup-=dt; spd=0;
      let dy=Math.atan2(tx-m.x,tz-m.z)-m.yaw; while(dy>Math.PI) dy-=6.283; while(dy<-Math.PI) dy+=6.283; m.yaw+=clamp(dy,-6*dt,6*dt);
    }
    if(!(m.windup>0)&&Math.hypot(tx-m.x,tz-m.z)<1.0){
      // reached the spot: carry on a little the way you were heading, then give up and search
      let next=null; if(!m.overshot&&m.lastDir){ for(let k=5;k>=2;k--){ const ox=tx+m.lastDir.x*k, oz=tz+m.lastDir.z*k; if(walkAt(ox,oz)&&clearPath(tx,tz,ox,oz)){ next={x:ox,z:oz}; break; } } }
      m.overshot=true;
      if(next) m.lastKnown=next; else { m.state='alert'; m.target={x:tx,z:tz}; m.lingerT=0; } }
    m.shriekT-=dt; if(m.shriekT<=0&&!(m.windup>0)&&shriek(m)!==false) m.shriekT=Math.max(0.3,m.shriekLeft-0.25); // never goes quiet while hunting: next scream overlaps the tail of the last
    // it is screaming/clattering as it runs: fresh dot snapshot of its body several times a second,
    // older snapshots keep fading -> you see a stuttering trail of it closing in (visible through walls when unseen)
    m.trailT-=dt; if(m.trailT<=0){ m.trailT=MR(0.09,0.15); const d=Math.hypot(player.x-m.x,player.z-m.z);
      if(d<45&&seesMonster(m)) sampleMonster(m,280,now+d/60,0.95,[1,0.6,0.5],F_BIG|(Math.random()<.35?F_NOISY:0)); }
  }
  if(m.state!=='hunt'){ if(m.freezeT>0){ m.freezeT-=dt; spd=0; } else if(Math.random()<dt*0.2) m.freezeT=MR(0.2,0.9); }
  const ox=m.x,oz=m.z;
  const nd=tx!==null&&spd>0?navDir(m,tx,tz):null;
  let wvx=0,wvz=0;
  if(nd){
    const [dx,dz]=nd;
    const want=Math.atan2(dx,dz); let dy=want-m.yaw; while(dy>Math.PI) dy-=6.283; while(dy<-Math.PI) dy+=6.283;
    const tr=m.state==='hunt'?9:2.2; m.yaw+=clamp(dy,-tr*dt,tr*dt);
    const face=Math.max(0,Math.cos(dy)); // must roughly face where it goes
    const v=spd*(m.state==='hunt'?1:(0.4+0.6*face))*(0.7+0.6*Math.abs(Math.sin(now*1.7+m.seed*3)));
    wvx=dx*v; wvz=dz*v;
  } else if(m.state==='idle'&&Math.random()<dt*0.5) m.yaw+=MR(-1.2,1.2); // weird snap turns
  // inertia: velocity chases the wanted velocity with limited acceleration -> they slide wide on sharp turns
  { const acc=(m.state==='hunt'?7:3.5)*dt; let ex=wvx-m.vx, ez=wvz-m.vz; const el=Math.hypot(ex,ez); if(el>acc){ ex*=acc/el; ez*=acc/el; }
    m.vx+=ex; m.vz+=ez;
    const bx=m.x, bz=m.z, sp0=Math.hypot(m.vx,m.vz);
    if(sp0>1e-3) moveCircle(m,m.vx*dt,m.vz*dt,0.3);
    const ax=(m.x-bx)/Math.max(dt,1e-4), az=(m.z-bz)/Math.max(dt,1e-4), sp1=Math.hypot(ax,az);
    m.vx=ax; m.vz=az;                                   // keep only what survived the collision (slides along walls)
    m.bumpT=Math.max(0,(m.bumpT||0)-dt);
    if(sp0>1.6&&sp1<sp0*0.55){ m.vx*=0.6; m.vz*=0.6;     // slammed into a wall: loses speed
      if(m.bumpT<=0&&m.state==='hunt'){ m.bumpT=0.6; sfxThump([m.x,0.9,m.z],0.6); } } }
  for(const o of monsters){ if(o===m) continue; const ddx=m.x-o.x,ddz=m.z-o.z,d=Math.hypot(ddx,ddz); if(d<0.65&&d>1e-4){ moveCircle(m,ddx/d*(0.65-d)*0.5,ddz/d*(0.65-d)*0.5,0.3);} }
  const moved=Math.hypot(m.x-ox,m.z-oz)/Math.max(dt,1e-4);
  m.curSpeed=lerp(m.curSpeed,moved,clamp(dt*8,0,1));
  m.runB=lerp(m.runB,(m.state==='hunt'&&m.curSpeed>1.3)?1:0,clamp(dt*3,0,1));
  m.rearB=lerp(m.rearB||0,(m.state==='hunt'&&m.windup>0)?1:0,clamp(dt*6,0,1));
  m.jaw=lerp(m.jaw,(m.state==='hunt'&&m.windup>0)?1:m.state==='hunt'?0.35+0.3*Math.max(0,Math.sin(now*7+m.seed)):0,clamp(dt*4,0,1));

  const sv=Math.sin(m.gait); if((sv>=0)!==(m.prevS>=0)&&m.curSpeed>1.6) monsterStep(m); m.prevS=sv;
  const reach=m.state==='hunt'?1.5:m.state==='alert'?1.15:0.9; // long arms: you can't slip past one
  if(!dead&&!won&&Math.hypot(player.x-m.x,player.z-m.z)<reach) die(m);
}

const player={x:0,z:0,yaw:0,pitch:0,bob:0};
let camY=EYE, playerMoving=false, sprinting=false, stepAcc=0;
const keys={};
function solidAt(cx,cz){ return !inb(cx,cz)||!walk[idx(cx,cz)]; }
function collide(o,r){
  for(let it=0;it<2;it++){ const cx=Math.floor(o.x),cz=Math.floor(o.z);
    for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){ const X=cx+dx,Z=cz+dz; if(!solidAt(X,Z)) continue;
      let X0=X,Z0=Z,X1=X+1,Z1=Z+1;
      if(inb(X,Z)&&cellType[idx(X,Z)]!==T_WALL){ const f=idx(X,Z)*4; X0=footprint[f];Z0=footprint[f+1];X1=footprint[f+2];Z1=footprint[f+3]; }
      const px=clamp(o.x,X0,X1),pz=clamp(o.z,Z0,Z1),ex=o.x-px,ez=o.z-pz,d=Math.hypot(ex,ez);
      if(d<r){ if(d<1e-6){ o.x+=(o.x-(X0+X1)/2)>0?r:-r; } else { o.x+=ex/d*(r-d); o.z+=ez/d*(r-d); } } } }
}
function moveCircle(o,dx,dz,r){ const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/0.2)); for(let i=0;i<n;i++){ o.x+=dx/n; o.z+=dz/n; collide(o,r); } }

let lastEcho=-9;
function runStepEcho(){
  const ex=player.x, ey=0.15, ez=player.z, sp=24;
  // sparse and always a bit broken; tiredness smears it in every direction until it's pure noise
  const f=fatigue, jit=0.28+3.2*Math.pow(f,1.1);
  emitEcho({x:ex,y:ey,z:ez,n:Math.round(ECHO_RAYS*0.35*(1-0.55*f)),maxD:30*(1-0.4*f),speed:sp,life:1.1*(1-0.45*f),
    flags:F_SMALL|(f>0.15?F_NOISY:0),I:1.0*(1-0.45*f),jit,mon:true,bounce:0});
  if(f>0.3) return; // only while fresh can you make out a shape in it (never signs)
  for(const m of monsters){ const d=Math.hypot(m.x-ex,m.z-ez); if(d<22&&(los(ex,camY,ez,m.x,1.5,m.z)||los(ex,camY,ez,m.x,0.7,m.z))) sampleMonster(m,140,now+d/sp,0.9,[1,0.86,0.8],F_NOISY); }
}
function playerEcho(silent){
  if(now-lastEcho<0.28) return; lastEcho=now;
  const ex=player.x,ey=camY,ez=player.z;
  const samples=emitEcho({x:ex,y:ey,z:ez,n:ECHO_RAYS,maxD:36,speed:24,life:1.5,flags:fatigue>0.6?F_NOISY:0,I:1.0,mon:true,sync:true,jit:1.6*Math.pow(fatigue,1.3)});
  for(const m of monsters){ const d=Math.hypot(m.x-ex,1.4-ey,m.z-ez);
    if(d<34&&(los(ex,ey,ez,m.x,1.5,m.z)||los(ex,ey,ez,m.x,0.7,m.z)||los(ex,ey,ez,m.x,1.95,m.z))) sampleMonster(m,520,now+d/24,1.5,[1,0.86,0.8],F_BIG); }
  for(const s of signs){ const d=Math.hypot(s.x-ex,s.y-ey,s.z-ez); if(d<30&&los(ex,ey,ez,s.x,s.y,s.z)) revealSign(s,now+d/24);
    const df=Math.hypot(s.x-ex,ey,s.z-ez); if(df<22&&los(ex,ey,ez,s.x,0.05,s.z)) revealFloorArrow(s,now+df/24); }
  { const e=exitInfo, px=e.fx+e.nx*0.1, pz=e.fz+e.nz*0.1, d=Math.hypot(px-ex,1.2-ey,pz-ez); if(d<36&&(los(ex,ey,ez,px,1.2,pz)||los(ex,ey,ez,px,2.4,pz))) revealExit(now+d/24); }
  sfxEcho(samples);
  if(!silent) hearPlayer('echo');
  if(!silent) document.getElementById('prompt').style.display='none';
}

let fatigue=0, heat=0, callT=8, ambushT=0, breathT=0, ambushed=0, debugView=false, exitPulseT=0, started=false, paused=true, dead=false, won=false, deathT=0, killer=null, staticBoost=0, fear=0, heartT=0, startTime=0, shake=0;

  pdata.fill(0); wStart=0; wCount=MAXP; phead=0; liveHist.length=0; echoJobs.length=0; fExp=-1; frameStartW=totalW;
  player.x=startInfo.x; player.z=startInfo.z; player.yaw=startInfo.yaw; player.pitch=0; player.px0=player.x; player.pz0=player.z; player.spd=0; player.vx=0; player.vz=0;
  dead=false; won=false; deathT=0; killer=null; staticBoost=0; fear=0; startTime=now; lastEcho=-9;
  shake=0; heartT=0; fatigue=0; heat=0; lastNoise={x:player.x,z:player.z,t:-99}; callT=8; ambushT=0; ambushed=0; breathT=0; player.bob=0; stepAcc=0; camY=EYE; playerMoving=false; sprinting=false;
  for(const k in keys) keys[k]=false; stick.id=null; stick.x=stick.y=0; stick.run=false; look.id=null; restStick();
  document.getElementById('vign').style.opacity=0; nc.style.opacity=0;
  document.getElementById('flash').style.opacity=0;
  document.getElementById('info').style.opacity=1;
  setTimeout(()=>{ if(!dead) document.getElementById('info').style.opacity=0.0; },14000);
  startExitBuzz();
  document.getElementById('prompt').style.display='';
}
function updatePressure(dt){
  // fatigue: ~10s of running wrecks you; walking/standing recovers
  if(sprinting) fatigue=Math.min(1,fatigue+dt/6); else fatigue=Math.max(0,fatigue-dt/(playerMoving?14:7));
  if(fatigue>0.25){ breathT-=dt; if(breathT<=0){ breathT=MR(1.0,1.15)-fatigue*0.55; sfxBreath(0.14+fatigue*0.3,breathT); } }
  // heat: long chases and long runs pull the whole level toward you
  // only hunters that heard you recently count: once you have shaken them off and gone quiet, the level cools down
  const hunting=monsters.filter(m=>m.state==='hunt'&&now-m.heardT<6).length;

<div data-lang="en"><p>You cannot see: click your tongue to light up the halls for a moment, find the exit, and don't let the blind creatures hear you. Headphones help a lot.</p><h3>On a computer</h3><ul><li>Click the screen to start; the mouse is captured to look around. <b>Esc</b> lets go of it and pauses.</li><li><b>W A S D</b> walk, <b>mouse</b> look, hold <b>Shift</b> to run (loud).</li><li><b>Space</b> echolocates: a wave of dots shows the walls. Monsters hear it, so don't overdo it.</li><li>Follow the green <b>EXIT</b> signs. <b>F</b> switches to full screen.</li></ul><h3>On a phone or tablet</h3><ul><li>Tap to start: the game goes full screen with the phone sideways.</li><li><b>Left thumb</b>: touch anywhere on the left and drag to walk. Push past the dashed outer ring to <b>run</b>.</li><li><b>Right thumb</b>: every touch on the right side echolocates. Keep holding and drag to look around; lift and touch again for the next echo.</li><li>You can walk, run, look and echo at the same time. Leaving full screen pauses the game.</li></ul></div>
<div data-lang="es"><p>No puedes ver: chasquea la lengua para iluminar los pasillos un instante, encuentra la salida y que no te oigan las criaturas ciegas. Con auriculares es mucho mejor.</p><h3>En un ordenador</h3><ul><li>Haz clic en la pantalla para empezar; el ratón queda capturado para mirar. <b>Esc</b> lo suelta y pone pausa.</li><li><b>W A S D</b> para andar, el <b>ratón</b> para mirar y mantén <b>Mayús</b> para correr (hace ruido).</li><li><b>Espacio</b> ecolocaliza: una onda de puntos muestra las paredes. Los monstruos lo oyen, así que no abuses.</li><li>Sigue las señales verdes de <b>EXIT</b>. <b>F</b> pone la pantalla completa.</li></ul><h3>En un móvil o tableta</h3><ul><li>Toca para empezar: el juego se pone en pantalla completa con el móvil en horizontal.</li><li><b>Pulgar izquierdo</b>: toca en cualquier sitio de la izquierda y arrastra para andar. Llévalo más allá del anillo discontinuo para <b>correr</b>.</li><li><b>Pulgar derecho</b>: cada toque a la derecha ecolocaliza. Mantén el dedo y arrastra para mirar; levántalo y vuelve a tocar para el siguiente eco.</li><li>Puedes andar, correr, mirar y hacer eco a la vez. Salir de la pantalla completa pone pausa.</li></ul></div>
<div data-lang="de"><p>Du kannst nichts sehen: Schnalze mit der Zunge, damit die Gänge kurz aufleuchten, finde den Ausgang und lass dich von den blinden Wesen nicht hören. Mit Kopfhörern geht es viel besser.</p><h3>Am Computer</h3><ul><li>Klicke ins Bild, um zu starten; die Maus wird zum Umsehen eingefangen. <b>Esc</b> gibt sie frei und pausiert.</li><li><b>W A S D</b> gehen, <b>Maus</b> umsehen, <b>Shift</b> gedrückt halten zum Rennen (laut).</li><li>Die <b>Leertaste</b> macht ein Echo: Eine Welle aus Punkten zeigt die Wände. Die Monster hören das, also nicht zu oft.</li><li>Folge den grünen <b>EXIT</b>-Schildern. <b>F</b> schaltet auf Vollbild.</li></ul><h3>Auf dem Handy oder Tablet</h3><ul><li>Tippe zum Starten: Das Spiel geht ins Vollbild, mit quer gehaltenem Handy.</li><li><b>Linker Daumen</b>: irgendwo links auflegen und ziehen zum Gehen. Über den gestrichelten äußeren Ring hinaus schieben zum <b>Rennen</b>.</li><li><b>Rechter Daumen</b>: Jede Berührung rechts macht ein Echo. Finger liegen lassen und ziehen zum Umsehen; anheben und neu tippen für das nächste Echo.</li><li>Gehen, rennen, umsehen und Echo gehen gleichzeitig. Wer das Vollbild verlässt, pausiert das Spiel.</li></ul></div>
