<!-- l102-topbar:start  Shared level102 top bar. Copy this whole block VERBATIM into every game (tests check it).
     HEAD part: paste right after <meta name="viewport">, before the game's own styles, so language and text size are
     known before the first paint (no flash of English).
     Gives the page: <html lang> = en|es|de (saved choice > OS language > English), CSS var --fs (text scale 0.8..1.8, default 1.1),
     a download link (the page itself, offline), a full-screen toggle (hidden where the browser can't do it), CSS var --l102-bar-h (height of the bar; the game must keep its own UI below it), window.L102 = { lang, fs, langs,
     setLang(l), setFs(v), help(open) }, and the events 'l102:lang', 'l102:fs' and 'l102:help' (detail: true = opened, false = closed) on window.
     A "?" button opens a help panel: "How to play" (from the page's own <template id="l102help-text"> with one <div data-lang="en|es|de">
     per language, anywhere in the page) + "About" (author, source code, licence). While it is open, keys, clicks and touches don't reach the game. -->
<style>
:root{--l102-bar-h:34px;--fs:1.1}
.l102bar{position:fixed;top:0;left:0;right:0;z-index:2147483000;height:var(--l102-bar-h);box-sizing:border-box;display:flex;align-items:center;gap:6px;
  padding:3px max(8px,env(safe-area-inset-right)) 3px max(8px,env(safe-area-inset-left));background:rgba(12,6,28,.55);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
.l102bar a{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;text-decoration:none;
  height:28px;line-height:28px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.14)}
.l102bar .l102sp{flex:1 1 0;min-width:0}
.l102bar select,.l102bar button,.l102bar a.l102dl{flex:0 0 auto;height:28px;min-width:32px;margin:0;padding:0 6px;border:0;border-radius:14px;
  background:rgba(255,255,255,.14);color:#fff;font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center}
.l102bar select option{color:#000}
.l102bar a.l102dl,.l102bar #l102full{display:inline-flex;align-items:center;justify-content:center;padding:0 6px;line-height:1}
.l102bar [hidden]{display:none!important}
.l102bar a:hover,.l102bar button:hover,.l102bar select:hover{background:rgba(255,255,255,.26)}
.l102bar a:focus-visible,.l102bar button:focus-visible,.l102bar select:focus-visible{outline:2px solid #ffd84d;outline-offset:1px}
.l102bar button:disabled{opacity:.4;cursor:default}
@media (max-width:340px){.l102bar{gap:4px}.l102bar a{padding:0 7px}}
.l102bar #l102help{font-weight:800;font-size:15px}
.l102dlg{position:fixed;inset:0;z-index:2147483001;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding:calc(var(--l102-bar-h) + 8px) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  background:rgba(8,4,20,.6);font:400 calc(var(--fs)*14px)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:pan-y}
.l102dlg[hidden]{display:none!important}
.l102box{position:relative;box-sizing:border-box;width:100%;max-width:540px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:14px 18px 16px;border-radius:16px;background:rgba(28,16,58,.97);box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;text-align:left}
.l102box h2{margin:2px 40px 6px 0;font-size:1.25em;line-height:1.2}
.l102box h2+h2,.l102box #l102how+h2{margin-top:16px}
.l102box h3{margin:10px 0 4px;font-size:1.02em;color:#ffd84d}
.l102box p{margin:4px 0}
.l102box ul{margin:4px 0;padding-left:1.3em}
.l102box li{margin:2px 0}
.l102box a{color:#9fd4ff}
.l102box #l102x{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:17px;background:rgba(255,255,255,.14);color:#fff;
  font:700 20px/1 system-ui,sans-serif;cursor:pointer}
.l102box #l102x:hover{background:rgba(255,255,255,.26)}
.l102box a:focus-visible,.l102box button:focus-visible{outline:2px solid #ffd84d;outline-offset:1px}
</style>
<script>
(function(){
  var LANGS=["en","es","de"],h=document.documentElement,lang=null,fs=1.1;
  try{lang=localStorage.getItem("l102.lang");fs=parseFloat(localStorage.getItem("l102.fs"))||1.1;}catch(e){}
  if(LANGS.indexOf(lang)<0){lang="en";var n=navigator.languages||[navigator.language||"en"];
    for(var i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(LANGS.indexOf(c)>=0){lang=c;break;}}}
  var clamp=function(v){return Math.round(Math.min(1.8,Math.max(.8,v))*10)/10;};
  fs=clamp(fs);h.lang=lang;h.style.setProperty("--fs",fs);
  window.L102={lang:lang,fs:fs,langs:LANGS,
    setLang:function(l){if(LANGS.indexOf(l)<0||l===this.lang)return;this.lang=l;h.lang=l;try{localStorage.setItem("l102.lang",l);}catch(e){}
      dispatchEvent(new CustomEvent("l102:lang",{detail:l}));},
    setFs:function(v){v=clamp(v);if(v===this.fs)return;this.fs=v;h.style.setProperty("--fs",v);try{localStorage.setItem("l102.fs",v);}catch(e){}
      dispatchEvent(new CustomEvent("l102:fs",{detail:v}));}};
})();
</script>
<!-- l102-topbar:head-end -->

<script>
(function(){
  var T={en:["Back to level102.com","Language","Smaller text","Bigger text","Download for offline use","Full screen","Exit full screen","Help","How to play","About","Close",
    "Made by Luis Quesada.","It is free software (GNU GPL v3 or later): you can play it, share it and change it.","Source code on GitHub"],
         es:["Volver a level102.com","Idioma","Texto más pequeño","Texto más grande","Descargar para jugar sin conexión","Pantalla completa","Salir de pantalla completa","Ayuda","Cómo se juega","Acerca de","Cerrar",
    "Hecho por Luis Quesada.","Es software libre (GNU GPL v3 o posterior): puedes jugarlo, compartirlo y modificarlo.","Código fuente en GitHub"],
         de:["Zurück zu level102.com","Sprache","Kleinere Schrift","Größere Schrift","Zum Offline-Spielen herunterladen","Vollbild","Vollbild beenden","Hilfe","So wird gespielt","Über","Schließen",
    "Gemacht von Luis Quesada.","Es ist freie Software (GNU GPL v3 oder neuer): Du darfst es spielen, teilen und verändern.","Quellcode auf GitHub"]};
  var back=document.getElementById("l102back"),sel=document.getElementById("l102lang"),
      minus=document.getElementById("l102minus"),plus=document.getElementById("l102plus"),dl=document.getElementById("l102dl"),
      full=document.getElementById("l102full"),fullp=document.getElementById("l102fullp"),d=document,de=d.documentElement,
      help=document.getElementById("l102help"),dlg=document.getElementById("l102dlg"),x=document.getElementById("l102x"),
      how=document.getElementById("l102how"),howH=document.getElementById("l102how-h"),about=document.getElementById("l102about"),aboutH=document.getElementById("l102about-h");
  // help panel: the page's <template id="l102help-text"> (one <div data-lang> per language) + About; the game gets 'l102:help' to pause
  function fillHelp(){var t=T[L102.lang],tp=d.getElementById("l102help-text"),c=tp&&tp.content,
      el=c&&(c.querySelector('[data-lang="'+L102.lang+'"]')||c.querySelector('[data-lang="en"]'));
    how.innerHTML="";if(el)how.appendChild(el.cloneNode(true));howH.hidden=how.hidden=!el;dlg.setAttribute("aria-labelledby",el?"l102how-h":"l102about-h");
    howH.textContent=t[8];aboutH.textContent=t[9];x.setAttribute("aria-label",t[10]);x.title=t[10];
    about.innerHTML="<p>"+t[11]+"</p><p>"+t[12]+"</p><p><a href=\"https://github.com/lquesada/level102\" target=\"_blank\" rel=\"noopener\">"+t[13]+": github.com/lquesada/level102</a></p>";}
  function openHelp(o){o=!!o;if(o===!dlg.hidden)return;if(o){fillHelp();dlg.hidden=false;try{d.exitPointerLock&&d.pointerLockElement&&d.exitPointerLock();}catch(e){}
      dlg.querySelector(".l102box").scrollTop=0;x.focus();}else{dlg.hidden=true;help.focus();}
    help.setAttribute("aria-expanded",o);dispatchEvent(new CustomEvent("l102:help",{detail:o}));}
  L102.help=openHelp;
  help.addEventListener("click",function(e){e.stopPropagation();openHelp(dlg.hidden);});
  x.addEventListener("click",function(){openHelp(false);});
  dlg.addEventListener("click",function(e){if(e.target===dlg)openHelp(false);});
  // nothing inside the panel reaches the game underneath
  ["pointerdown","pointerup","pointermove","mousedown","mouseup","mousemove","click","dblclick","contextmenu","wheel","touchstart","touchmove","touchend","touchcancel"]
    .forEach(function(n){dlg.addEventListener(n,function(e){e.stopPropagation();},{passive:true});});
  ["keydown","keyup","keypress"].forEach(function(n){addEventListener(n,function(e){if(dlg.hidden)return;e.stopImmediatePropagation();
    if(n==="keydown"&&e.key==="Escape"){e.preventDefault();openHelp(false);}},true);});
  // full screen: browser's own exit (Esc, Android back) also works; hidden where unsupported (e.g. iPhone)
  function isFull(){return !!(d.fullscreenElement||d.webkitFullscreenElement);}
  if(!(d.fullscreenEnabled||d.webkitFullscreenEnabled))full.hidden=true;
  full.addEventListener("click",function(){try{var p=isFull()?(d.exitFullscreen||d.webkitExitFullscreen).call(d)
    :(de.requestFullscreen||de.webkitRequestFullscreen).call(de,{navigationUI:"hide"});if(p&&p.catch)p.catch(function(){});}catch(e){}});
  d.addEventListener("fullscreenchange",paint);d.addEventListener("webkitfullscreenchange",paint);
  // download = this very page (one self-contained file), named after its folder: /drinkmixer/ -> drinkmixer.html
  var parts=location.pathname.split("/").filter(Boolean),last=parts[parts.length-1]||"";
  if(/\.html?$/.test(last))last=parts[parts.length-2]||"";
  dl.href=location.href.split("#")[0].split("?")[0];dl.setAttribute("download",(last&&last!=="docs"?last:"level102")+".html");
  function paint(){var t=T[L102.lang];back.textContent="‹ "+t[0];sel.value=L102.lang;sel.setAttribute("aria-label",t[1]);
    minus.setAttribute("aria-label",t[2]);minus.title=t[2];plus.setAttribute("aria-label",t[3]);plus.title=t[3];
    dl.setAttribute("aria-label",t[4]);dl.title=t[4];
    var f=isFull();full.setAttribute("aria-label",t[f?6:5]);full.title=t[f?6:5];full.setAttribute("aria-pressed",f);
    fullp.setAttribute("d",f?"M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5":"M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5");
    minus.disabled=L102.fs<=.8;plus.disabled=L102.fs>=1.8;help.setAttribute("aria-label",t[7]);help.title=t[7];if(!dlg.hidden)fillHelp();}
  sel.addEventListener("change",function(){L102.setLang(sel.value);});
  minus.addEventListener("click",function(){L102.setFs(L102.fs-.1);});
  plus.addEventListener("click",function(){L102.setFs(L102.fs+.1);});
  addEventListener("l102:lang",paint);addEventListener("l102:fs",paint);paint();
})();
</script>
