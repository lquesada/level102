  const che=[Math.sin(now*1.3+m.seed)*0.04, pel[1]+Math.cos(lean)*0.62, Math.sin(lean)*0.62];
  const nk=[che[0]+m.twX*0.05, che[1]+Math.cos(lean+0.5)*m.neck, che[2]+Math.sin(lean+0.5)*m.neck+D*0.35];
  const hd=[nk[0]+m.twX*0.13, nk[1]+0.09-run*0.05+D*0.08, nk[2]+0.12+D*0.3];
  const L=[[pel,che,0.13],[che,nk,0.06],[nk,hd,0.04]];
  L.push([[che[0]-0.24,che[1]-0.05,che[2]],[che[0]+0.24,che[1]-0.05,che[2]],0.06]); // shoulders
  for(let k=0;k<4;k++){ const y=lerp(pel[1],che[1],0.35+k*0.15), zz=lerp(0,che[2],0.35+k*0.15); L.push([[-0.15,y,zz+0.05],[0.15,y,zz+0.05],0.025]); } // ribs

    const hip=[sg*0.13,pel[1]-0.03,0], stride=(0.22+run*0.45)*mv;
    const foot=[sg*0.2, Math.max(0,Math.sin(ph))*(0.12+run*0.2)*mv, Math.cos(ph)*stride];
    const knee=ik(hip,foot,0.64,[0,0.15,-1]);
    L.push([hip,knee,0.065],[knee,foot,0.045],[foot,[foot[0],0.02,foot[2]+0.2],0.03]);
    const sh=[che[0]+sg*0.24,che[1]-0.05,che[2]];
    const sw=Math.sin(ph+Math.PI)*0.25*mv;
    const hI=[sg*0.34, Math.max(0.12,sh[1]-1.2), sh[2]+0.12+sw];
    const hR=[sg*(0.35+0.12*Math.sin(now*9+sg)), sh[1]-0.35+Math.sin(ph)*0.28, sh[2]+0.75+Math.cos(ph)*0.22];
    const hD=[sg*(0.55-D*0.25), sh[1]+0.25, sh[2]+0.75+D*0.2];

// can you see any part of it? the chest first (cheap), then head, hands, elbows, knees, feet... a hand sticking out
// past a corner counts. The parts that are behind walls are hidden by the depth pass when drawn.
function seesMonster(m){
  if(los(player.x,camY,player.z,m.x,1.4,m.z)) return true;
  const P=poseOf(m), h=P.head;
  const ey=camY+(player.gy||0); if(losRaw(player.x,ey,player.z,h[0],h[1],h[2])) return true;
  for(const sg of P.segs) for(const q of [sg[0],sg[1]]) if(losRaw(player.x,ey,player.z,q[0],Math.max((m.gy||0)+0.05,q[1]),q[2])) return true;

function sampleMonster(m,n,appear,life,col,flags){ if(has('pill')) return; if(m.kind==='shade'&&!dead) return; if(m.hidden) return; if(COLOF[m.kind]) col=COLOF[m.kind](m,col);

  const nb=P.noHead?n:Math.floor(n*0.68);
  for(let i=0;i<nb;i++){
    const q=Math.random()*tot; let k=0; while(w[k]<q) k++;
    const [a,b,r]=segs[k]; const t=Math.random();
    let ax=b[0]-a[0],ay=b[1]-a[1],az=b[2]-a[2]; const al=Math.hypot(ax,ay,az)||1; ax/=al;ay/=al;az/=al;
    let vx=Math.random()-.5,vy=Math.random()-.5,vz=Math.random()-.5; const dp=vx*ax+vy*ay+vz*az; vx-=ax*dp;vy-=ay*dp;vz-=az*dp;
    const vl=Math.hypot(vx,vy,vz)||1; const rr=r*(0.85+Math.random()*0.3)/vl;
    const br=0.6+Math.random()*0.5;

}

// nav
const navCache=new Map();
function getNav(ti){ let d=navCache.get(ti); if(!d){ d=bfs(ti,walk); navCache.set(ti,d); if(navCache.size>80) navCache.delete(navCache.keys().next().value); } return d; }

  for(let i=0;i<=n;i++){ const x=ax+dx*i/n,z=az+dz*i/n; if(!walkAt(x,z)||!walkAt(x+px,z+pz)||!walkAt(x-px,z-pz)) return false; if(avoid&&matAt(x,z)===1) return false; } return true; }
// calm monsters won't walk into reverb rooms (too loud in there) unless they are already inside -- whatever path is chosen
function navDir(m,tx,tz){ const r=navDir0(m,tx,tz);
  if(r&&m.state!=='hunt'&&matAt(m.x,m.z)!==1&&(matAt(m.x+r[0]*0.6,m.z+r[1]*0.6)===1||matAt(m.x+r[0]*0.3,m.z+r[1]*0.3)===1)) return null;
  return r; }
function navDir0(m,tx,tz){
  const avoid=m.state!=='hunt'&&matAt(m.x,m.z)!==1;
  let dx=tx-m.x,dz=tz-m.z; const dl=Math.hypot(dx,dz)||1;
  if(dl<1.0&&!(avoid&&matAt(tx,tz)===1)) return [dx/dl,dz/dl];
  if(clearPath(m.x,m.z,tx,tz,avoid)) return [dx/dl,dz/dl];
  const ti=idx(Math.floor(tx),Math.floor(tz)); if(!walk[ti]) return [dx/dl,dz/dl];
  const d=getNav(ti), ci=idx(Math.floor(m.x),Math.floor(m.z)); if(d[ci]<0) return [dx/dl,dz/dl];
  let cur=ci, goal=-1;
  for(let s=0;s<8;s++){ let best=cur,bd=d[cur];
    for(const o of [1,-1,W,-W]){ const n=cur+o; if(n>=0&&n<W*H&&d[n]>=0&&d[n]<bd&&!(avoid&&mat[n]===1)){bd=d[n];best=n;} }
    if(best===cur) break; cur=best;
    const gx=cur%W+0.5,gz=((cur/W)|0)+0.5;
    if(goal<0||clearPath(m.x,m.z,gx,gz,avoid)) goal=cur; else break; }
  if(goal<0) return avoid?null:[dx/dl,dz/dl];
  dx=goal%W+0.5-m.x; dz=((goal/W)|0)+0.5-m.z; const l=Math.hypot(dx,dz)||1; return [dx/l,dz/l];
}

function enterAlert(m,x,z){ if(BR[m.kind]||m.asleep||m.pace||m.post) return; if(m.state==='hunt'||m.state==='kill'||(m.kind==='mimic'&&!m.awake)) return; const was=m.state; m.state='alert'; m.target={x,z}; m.lingerT=0; m.freezeT=R(0.3,0.9);
  if(was==='idle') sfxChitter([m.x,1.8,m.z],0.9); }
// enterHunt(m): it heard/sensed you itself -> knows where you are now and which way you were going.
// enterHunt(m,pos,t): told by another monster's scream or by the level's heat -> only that (maybe stale) spot, no heading;
// ignored by a hunter that already has fresher information. Nothing ever hands them your live position: hiding works.
function enterHunt(m,pos,t){ if(BR[m.kind]||m.asleep||m.pace||m.post) return; if(m.state==='kill'||(m.kind==='mimic'&&!m.awake)) return;

  if(m.state!=='hunt'){ const st=m.kind==='stalker'; m.state='hunt'; m.windup=st?1.0:0.3; m.wShriek=st; m.shriekT=R(1.6,3.2); m.freezeT=0; m.crumbT=now-1; }
  m.overshot=false;
  if(pos){ m.heardT=t; m.lastKnown={x:pos.x,z:pos.z}; m.lastDir=null; return; }
  m.heardT=now; m.lastKnown={x:player.x,z:player.z}; noteHeard();
  const v=Math.hypot(player.vx||0,player.vz||0); m.lastDir=v>0.6?{x:player.vx/v,z:player.vz/v}:null; }
// the last time and place any monster actually heard or sensed you (what the level's "heat" can know)
let lastNoise={x:0,z:0,t:-99};
function noteHeard(){ lastNoise={x:player.x,z:player.z,t:now}; }

// sound the player made at (x,z): kind 'echo' or 'step'
// Sounds the player makes have a power that falls off with distance (walls muffle).
// faint -> curious (walks toward the sound); clear, or several in a row -> shriek & chase.
// heard with a clear line: it knows where you are and which way you go. Heard round corners/through walls: only roughly
// where (2-8 m off, more the farther), no heading -- so it goes to about where it last heard you and has to search there.
function roughly(d){ const e=clamp(d*TUNE.rough,TUNE.rough*8,TUNE.rough*32); for(let t=0;t<12;t++){ const x=player.x+MR(-e,e), z=player.z+MR(-e,e); if(walkAt(x,z)) return {x,z}; } return {x:player.x,z:player.z}; }

  for(const m of monsters){ if(m.state==='kill'||m.asleep) continue;
    const d=Math.hypot(m.x-player.x,m.z-player.z); if(d>45) continue;
    if(BR[m.kind]){ if(HEARS[m.kind]) HEARS[m.kind](m,kind,d,player.x,player.z); continue; }
    if(m.kind==='mimic'&&!m.awake){ if(kind==='echo'&&d<TUNE.mimicRange){ m.awake=true; enterHunt(m); } continue; }   // wanders harmlessly until you echo close to it
    const clear=los(player.x,EYE,player.z,m.x,1.5,m.z), eff=d*(clear?1:TUNE.walls);   // walls and corners muffle a lot

let frameNo=0, shriekFrame=-1;
function shriek(m){

  if(k>0.05) emitEcho({x:player.x,y:EYE,z:player.z,n:Math.round(3500*k),maxD:30,speed:30,life:1.5,flags:F_NOISY,col:[0.7,0.05,0.08],I:0.8*k,ax:hx,ay:hy,az:hz});

// while it keeps screaming, the scream keeps flooding the area with echo
const nearK=d=>Math.pow(clamp(1-d/TUNE.redRange,0,1),1.6);   // 1 right next to you .. 0 from ~28 m

  const d=Math.hypot(player.x-m.x,player.z-m.z), k=seesMonster(m)?nearK(d):0;
  emitEcho({x:m.x,y:1.8,z:m.z,n:Math.round(3000+3500*k),maxD:42,speed:30,life:1.1,flags:0,col:[1,0.12,0.08],I:0.5+0.75*k,skip:m});
  if(seesMonster(m)) sampleMonster(m,260,now+d/30,0.8,[1,0.3,0.25],F_NOISY|F_BIG);

function monsterStep(m){
  const fx=Math.sin(m.yaw),fz=Math.cos(m.yaw);
  const x=m.x+fx*0.3, z=m.z+fz*0.3;
  emitEcho({x,y:0.25,z,n:420,maxD:9,speed:16,life:0.9,flags:0,col:[1,0.32,0.12],I:0.9,skip:m});
  const d=Math.hypot(player.x-x,player.z-z);
  if(seesMonster(m)) sampleMonster(m,170,now+d/40,0.55,[1,0.45,0.32],F_BIG);

// after giving up somewhere it keeps away from there (16 m) for a while: if you hid nearby, it won't stumble back onto you
const isBored=(m,x,z)=>m.bored&&now<m.bored.until&&Math.hypot(x-m.bored.x,z-m.bored.z)<16;
// a walk to another room 15-50 m away (never a reverb room): free floor near its middle
function roomTrip(m){ const here=roomOf[idx(Math.floor(m.x),Math.floor(m.z))];
  const opts=rooms.filter(r=>r.id!==here&&r.mat!==1&&!isBored(m,r.cx,r.cz)&&Math.hypot(r.cx-m.x,r.cz-m.z)>15&&Math.hypot(r.cx-m.x,r.cz-m.z)<50); if(!opts.length) return false;
  const r=opts[(Math.random()*opts.length)|0];
  for(let t=0;t<20;t++){ const x=RI(r.x+1,r.x+r.w-2), z=RI(r.z+1,r.z+r.h-2); if(walk[idx(x,z)]){ m.target={x:x+.5,z:z+.5}; m.trip=true; return true; } }
  return false; }
// lost you: go idle and head for somewhere at least 15 m away from where it searched
function giveUp(m,sx,sz){ m.state='idle'; m.awake=false; m.target=null; m.trip=false; m.spotN=0; m.susp=0;

  // somewhere 15+ m from where it searched, on the far side from you (so its way there doesn't lead back past you)
  const ax=m.x-player.x, az=m.z-player.z, al=Math.hypot(ax,az)||1; let fallback=null;
  for(let t=0;t<80;t++){ const x=Math.floor(m.x)+RI(-26,26), z=Math.floor(m.z)+RI(-26,26);
    if(!(inb(x,z)&&walk[idx(x,z)]&&mat[idx(x,z)]!==1&&Math.hypot(x+.5-sx,z+.5-sz)>15&&Math.hypot(x+.5-player.x,z+.5-player.z)>10)) continue;
    const dx=x+.5-m.x, dz=z+.5-m.z, dl=Math.hypot(dx,dz)||1;
    if((dx*ax+dz*az)/(dl*al)>0.2){ m.target={x:x+.5,z:z+.5}; break; } else if(!fallback) fallback={x:x+.5,z:z+.5}; }

      if(inb(X,Z)&&cellType[idx(X,Z)]!==T_WALL){ const f=idx(X,Z)*4; X0=footprint[f];Z0=footprint[f+1];X1=footprint[f+2];Z1=footprint[f+3]; }

  const all=(k,n,dur,fn)=>Promise.all(Array.from({length:n},()=>mk(dur,fn))).then(b=>{ if(AC===live) BAKED[k]=b; }).catch(()=>{});
  all('click3',6,.4,(o,t)=>clickBody(o,t,3)); all('click2',4,.3,(o,t)=>clickBody(o,t,2)); all('chitter',5,.8,(o,t)=>chitterBody(o,t)); }
function playBaked(k,o,t){ const L=BAKED[k]; if(!L) return false; const b=AC.createBufferSource(); b.buffer=L[(Math.random()*L.length)|0]; b.playbackRate.value=MR(.94,1.06); b.connect(o); b.start(t); return true; }
function clickBody(o,t,n){ const gap=MR(0.05,0.09);
  for(const dt of [0,gap,gap*2.1].slice(0,n)){ burst(o,t+dt,MR(2600,3800),3.5,'bandpass',0.0008,1,0.018);   // sharp tongue clack
    burst(o,t+dt+0.004,MR(900,1300),6,'bandpass',0.001,0.7,0.05);                               // wet throat resonance
    const os=AC.createOscillator(); os.type='triangle'; os.frequency.setValueAtTime(MR(520,700),t+dt); os.frequency.exponentialRampToValueAtTime(160,t+dt+0.045);
    const g=envG(t+dt,0.001,0.45,0.05); os.connect(g); g.connect(o); os.start(t+dt); os.stop(t+dt+0.09); } }
function chitterBody(o,t){ const n=RI(5,12); for(let i=0;i<n;i++) burst(o,t+i*MR(0.025,0.06),MR(1200,3200),6,'bandpass',0.001,0.8,0.02); }
function sfxMonClick(pos,v){ if(!AC) return; const d=Math.hypot(pos[0]-player.x,pos[2]-player.z); if(d>70) return;
  clickTok=Math.min(8,clickTok+(now-clickT)*[14,10,7,5][audioLoad]); clickT=now; if(clickTok<(d<15?1:d<35?3:5)) return; clickTok-=1;
  const t=AC.currentTime, o=dest(pos,v*2.2*up('pwEars','ears'),0.7,4,0.65); if(o._sink) return; // carries far; place it with headphones
  if(!playBaked(d<25?'click3':'click2',o,t)) clickBody(o,t,d<25?3:2); }

function sfxGrunt(k){ if(!AC) return; const t=AC.currentTime, o=dest(null,.5+k*.4,.25), os=AC.createOscillator(); os.type='sawtooth'; os.frequency.setValueAtTime(MR(105,135),t); os.frequency.linearRampToValueAtTime(MR(72,88),t+.34); const a=AC.createBiquadFilter(); a.type='bandpass'; a.frequency.value=520; a.Q.value=2.2; const b=AC.createBiquadFilter(); b.type='bandpass'; b.frequency.value=1150; b.Q.value=3; const g=envG(t,.05,.9,.32); os.connect(a); os.connect(b); a.connect(g); b.connect(g); g.connect(o); os.start(t); os.stop(t+.42); }

const harshCurve=(()=>{ const c=new Float32Array(2048); for(let i=0;i<2048;i++){ const x=i/1024-1; c[i]=Math.tanh(x*14)*0.8+Math.sign(x)*Math.pow(Math.abs(x),0.3)*0.2; } return c; })();
const shriekEnds=[];   // end times of the full scream voices playing now
function sfxShriek(pos,vol,D,must){ if(!AC) return null; const t=AC.currentTime;
  const dur=D||MR(2.2,2.9), t1=t+0.22; // short wet gasp, then the scream
  for(let i=shriekEnds.length-1;i>=0;i--) if(shriekEnds[i]<t) shriekEnds.splice(i,1);
  if(shriekEnds.length>=2&&!must) return sfxShriekLite(pos,vol,dur);   // a chorus: keep the audio thread (phones!) from choking
  shriekEnds.push(t1+dur);
  const o=dest(pos,vol,1.7,2,0.8);
  { const rb=dest(pos,0.25*vol,2.4,6,0.5); o._rb=rb; const os=AC.createOscillator(); os.type='sawtooth'; os.frequency.setValueAtTime(150,t1); os.frequency.exponentialRampToValueAtTime(65,t1+dur); // low resonance through walls
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=360; const g=envG(t1,0.1,0.6,dur); os.connect(lp); lp.connect(g); g.connect(rb); os.start(t1); os.stop(t1+dur+0.2); }
  burst(o,t,MR(900,1300),1.5,'bandpass',0.06,0.5,0.16); // inhale
  const ws=AC.createWaveShaper(); ws.curve=harshCurve; ws.oversample='2x';
  const amp=AC.createGain(); amp.gain.setValueAtTime(0.0001,t1); amp.gain.exponentialRampToValueAtTime(0.65,t1+0.03);
  // stutters / chokes inside the scream
  for(let k=0;k<5;k++){ const ts=t1+MR(0.25,dur-0.3); amp.gain.setValueAtTime(0.65,ts); amp.gain.linearRampToValueAtTime(0.08,ts+0.03); amp.gain.linearRampToValueAtTime(0.65,ts+MR(0.05,0.12)); }
  amp.gain.setValueAtTime(0.65,t1+dur-0.35); amp.gain.exponentialRampToValueAtTime(0.0001,t1+dur);
  // rattling tremolo in the throat
  const trem=AC.createGain(); trem.gain.value=0.6; const tl=AC.createOscillator(); tl.type='square'; tl.frequency.setValueAtTime(MR(24,34),t1); tl.frequency.linearRampToValueAtTime(MR(45,60),t1+dur);
  const tg=AC.createGain(); tg.gain.value=0.4; tl.connect(tg); tg.connect(trem.gain); tl.start(t1); tl.stop(t1+dur+0.1);
  ws.connect(trem); trem.connect(amp); amp.connect(o);
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500; hp.connect(ws);
  const base=MR(850,1250);
  for(const [k,type,gv] of [[1,'sawtooth',0.22],[1.33,'square',0.12],[1.99,'sawtooth',0.14],[2.71,'sawtooth',0.08]]){ const os=AC.createOscillator(); os.type=type;
    // erratic sample-and-hold pitch: the voice cracks and jumps
    let tt=t1; os.frequency.setValueAtTime(base*k*0.7,tt); os.frequency.exponentialRampToValueAtTime(base*k*MR(1.5,1.9),tt+0.08);
    tt+=0.08; while(tt<t1+dur){ const step=MR(0.05,0.16); os.frequency.setValueAtTime(base*k*MR(0.9,2.1),tt); os.frequency.linearRampToValueAtTime(base*k*MR(0.85,2.0),tt+step); tt+=step; }
    os.detune.value=MR(-60,60);
    const l=AC.createOscillator(); l.frequency.value=MR(38,55); const lg=AC.createGain(); lg.gain.value=base*k*0.06; l.connect(lg); lg.connect(os.frequency);
    const og=AC.createGain(); og.gain.value=gv; os.connect(og); og.connect(hp); os.start(t1); os.stop(t1+dur+0.05); l.start(t1); l.stop(t1+dur+0.05); }
  // piercing hiss on top
  for(const [f0,f1] of [[2400,3600],[4200,6000]]){ const n=noiseSrc(), bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=7;
    bp.frequency.setValueAtTime(f0,t1); bp.frequency.linearRampToValueAtTime(f1,t1+dur*0.4); bp.frequency.linearRampToValueAtTime(f0*1.1,t1+dur);
    const ng=AC.createGain(); ng.gain.value=0.55; n.connect(bp); bp.connect(ng); ng.connect(hp); n.start(t1,Math.random()); n.stop(t1+dur+0.05); }
  return o;
}
const liteEnds=[];   // the light screams playing now: at most 3 at once (a chorus of 10 choked the audio thread)
function sfxShriekLite(pos,vol,dur){ if(!AC) return; { const t0=AC.currentTime; for(let i=liteEnds.length-1;i>=0;i--) if(liteEnds[i]<t0) liteEnds.splice(i,1); if(liteEnds.length>=3) return; liteEnds.push(t0+0.22+(dur||1.6)+0.3); }
  const t=AC.currentTime, t1=t+0.22, o=dest(pos,vol*0.8,1.2,2,0.8); if(o._sink) return;
  const ws=AC.createWaveShaper(); ws.curve=harshCurve; const amp=envG(t1,0.03,0.55,dur); ws.connect(amp); amp.connect(o);
  const base=MR(850,1250);
  for(const [k,gv] of [[1,0.3],[1.99,0.18]]){ const os=AC.createOscillator(); os.type='sawtooth';
    let tt=t1; os.frequency.setValueAtTime(base*k,tt); while(tt<t1+dur){ const step=MR(0.06,0.18); os.frequency.linearRampToValueAtTime(base*k*MR(0.85,2.0),tt+step); tt+=step; }
    const og=AC.createGain(); og.gain.value=gv; os.connect(og); og.connect(ws); os.start(t1); os.stop(t1+dur+0.05); }
  const n=noiseSrc(), bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=6; bp.frequency.value=MR(2600,3600); const ng=AC.createGain(); ng.gain.value=0.4;
  n.connect(bp); bp.connect(ng); ng.connect(ws); n.start(t1,Math.random()); n.stop(t1+dur+0.05);
  return o;
}

function frontOf(x,z,nx,nz){ for(const d of [3,2.6,2.2,1.8]){ const px=x+nx*d, pz=z+nz*d; if(walkAt(px,pz)){ player.x=px; player.z=pz; break; } } player.yaw=Math.atan2(-nx,-nz); player.pitch=0; player.px0=player.x; player.pz0=player.z; player.gy=groundOf(player.x,player.z); doorArm.ent=true; }
