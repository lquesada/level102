<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
@@TOPBAR_HEAD@@
<title>Echoloc</title>
<link rel="icon" type="image/svg+xml" href="@@FAVICON@@">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;font-family:"Courier New",monospace;color:#9fd8ff;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #noise{pointer-events:none;opacity:0;image-rendering:pixelated;mix-blend-mode:screen}
  #vign{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(160,0,0,.85) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#a00}
  #prompt{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);font-size:calc(15px*var(--fs));letter-spacing:.35em;color:#bfe9ff;
    text-shadow:0 0 8px #3af,0 0 18px #06f;animation:pulse 2.2s ease-in-out infinite;pointer-events:none;white-space:nowrap}
  #prompt.hit{animation:none;opacity:1;color:#fff;text-shadow:0 0 14px #fff,0 0 30px #4cf}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.75}}
  #info{position:fixed;left:max(16px,env(safe-area-inset-left));top:calc(var(--l102-bar-h) + 10px);font-size:calc(12px*var(--fs));line-height:1.6;color:#5b7f99;pointer-events:none;transition:opacity 2s}
  #info b{color:#7fc4ff;font-weight:normal}
  #overlay{position:fixed;left:0;right:0;bottom:0;top:var(--l102-bar-h);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);text-align:center;cursor:pointer;padding:16px;box-sizing:border-box}
  #overlay h1{font-size:clamp(30px,9vw,64px);letter-spacing:.4em;margin:0 0 12px 0.5em;color:#cfefff;text-shadow:0 0 12px #39f,0 0 40px #06f;font-weight:normal}
  #overlay h1.red{color:#ffb0a0;text-shadow:0 0 12px #f22,0 0 40px #a00}
  #overlay h1.green{color:#c0ffc8;text-shadow:0 0 12px #2f6,0 0 40px #0a3}
  #overlay p{max-width:600px;color:#6f93ad;line-height:1.7;font-size:calc(14px*var(--fs));margin:6px 0}
  #overlay p.secret{color:#7fe0a0;border:1px dashed rgba(120,230,160,.4);border-radius:6px;padding:8px 12px;margin-top:14px}
  .eyesBtn.helpBtn{display:block;margin:14px auto 0;color:#cfefff;background:rgba(40,90,140,.6);box-shadow:none;border:1px solid #2a4a66}
  .eyesBtn{margin-top:14px;padding:12px 20px;font:inherit;font-size:calc(14px*var(--fs));letter-spacing:.2em;color:#032;background:#8fe8b0;border:0;border-radius:6px;box-shadow:0 0 18px #2c8;cursor:pointer}
  #overlay .go{margin-top:26px;font-size:calc(14px*var(--fs));color:#cfefff;letter-spacing:.3em;animation:pulse 1.6s infinite}
  kbd{color:#bfe9ff;border:1px solid #2a4a66;padding:0 5px;border-radius:3px}
  #touch{position:fixed;left:0;right:0;bottom:0;top:var(--l102-bar-h);z-index:10;display:none;touch-action:none}
  /* floating stick: inner ring = walk, push the knob past the dashed outer ring = run */
  #stickBase{position:fixed;width:208px;height:208px;margin:-104px 0 0 -104px;border-radius:50%;border:2px dashed rgba(255,150,130,.38);pointer-events:none;box-sizing:border-box}
  #stickBase::before{content:"";position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(120,200,255,.32);background:rgba(20,60,100,.1);box-sizing:border-box}
  #stickRun{position:absolute;left:0;right:0;top:-2px;transform:translateY(-100%);text-align:center;font-size:calc(11px*var(--fs));letter-spacing:.25em;color:rgba(255,170,150,.75)}
  #stickBase.run{border-color:rgba(255,140,120,.85);border-style:solid}
  #stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(120,200,255,.25);border:2px solid rgba(160,220,255,.5);box-sizing:border-box}
  #stickKnob.run{background:rgba(255,120,100,.4);border-color:rgba(255,160,140,.8)}
  #echoBtn{position:fixed;right:calc(max(4%,env(safe-area-inset-right)) + 22px);bottom:calc(9% + 136px);width:76px;height:76px;border-radius:50%;box-sizing:border-box;
    border:2px solid rgba(140,215,255,.75);background:rgba(20,70,120,.3);color:#cfefff;display:flex;align-items:center;justify-content:center;
    font-size:calc(13px*var(--fs));letter-spacing:.15em;text-shadow:0 0 8px #3af;box-shadow:0 0 14px rgba(60,170,255,.35)}
  #echoBtn.on{background:rgba(140,215,255,.6);color:#fff}
  @media (max-height:380px){#echoBtn{bottom:calc(6% + 128px);width:66px;height:66px}}
  #lookHint{position:fixed;right:max(4%,env(safe-area-inset-right));bottom:9%;width:120px;height:120px;border-radius:50%;border:2px dotted rgba(120,200,255,.3);
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(10px*var(--fs));letter-spacing:.12em;line-height:1.5;color:rgba(160,215,255,.6);pointer-events:none;transition:opacity 1.5s}
  #rotate{position:fixed;left:0;right:0;bottom:0;top:var(--l102-bar-h);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#000;color:#cfefff;text-align:center;padding:16px;box-sizing:border-box;font-size:calc(15px*var(--fs));letter-spacing:.2em}
  #rotate p{margin:0;color:#6f93ad;letter-spacing:.05em;font-size:calc(13px*var(--fs))}
  #rotate svg{animation:tilt 2.4s ease-in-out infinite}
  @keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){html.touch #rotate{display:flex}}
  html:fullscreen #info{display:none}
  html:fullscreen{--l102-bar-h:0px} html:fullscreen .l102bar{display:none}
  html:-webkit-full-screen #info{display:none}
  html:-webkit-full-screen{--l102-bar-h:0px} html:-webkit-full-screen .l102bar{display:none}
  .sub{margin-top:10px;font-size:calc(12px*var(--fs));color:#5b7f99}
  #map{position:fixed;left:auto;bottom:auto;right:max(10px,env(safe-area-inset-right));top:calc(var(--l102-bar-h) + 10px);width:min(300px,42vh);height:min(300px,42vh);z-index:20;display:none;pointer-events:none;border-radius:50%}
  #cheats{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;display:none;padding:14px 20px;background:rgba(0,8,16,.92);border:1px solid #2a4a66;border-radius:8px;
    color:#bfe9ff;font-size:calc(13px*var(--fs));line-height:1.8;letter-spacing:.08em;white-space:nowrap;pointer-events:none}
  #cheats b{color:#7fe0a0;font-weight:normal}
  /* letmechoose panel: everything on one screen */
  #tune{position:fixed;left:0;right:0;bottom:0;top:var(--l102-bar-h);z-index:45;display:none;flex-direction:column;gap:6px;padding:8px 12px;box-sizing:border-box;
    background:rgba(0,6,14,.94);color:#9fd8ff;font:11px/1.25 "Courier New",monospace;overflow-y:auto}
  #tune .tuneHead{color:#6f93ad} #tune .tuneHead b{color:#cfefff;letter-spacing:.2em}
  #tune .tuneGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 16px;align-content:start}
  #tune .tuneGroup{grid-column:1/-1;color:#7fe0a0;letter-spacing:.2em;text-transform:uppercase;margin-top:4px;border-bottom:1px solid #1d3a50}
  #tune .tuneRow{display:grid;grid-template-columns:1fr 92px 38px;align-items:center;gap:6px;min-height:20px}
  #tune .tuneRow span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis} #tune .tuneRow.changed span,#tune .tuneRow.changed output{color:#ffd84d}
  #tune input[type=range]{width:100%;margin:0;accent-color:#4cf} #tune output{text-align:right;color:#cfefff}
  #tune .tuneBtns{display:flex;gap:8px;flex-wrap:wrap} #tune button{font:inherit;padding:6px 10px;border:1px solid #2a4a66;background:#0d2a44;color:#cfefff;border-radius:4px;cursor:pointer}
  #tune .tuneOut{width:100%;box-sizing:border-box;font:inherit;background:#000;color:#ffd84d;border:1px solid #1d3a50;resize:none}
  #toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:50;font-size:calc(13px*var(--fs));white-space:nowrap;letter-spacing:.3em;color:#ffe9a0;text-shadow:0 0 10px #f90;opacity:0;transition:opacity .4s;pointer-events:none}
  @media (max-height:520px){
    #overlay{justify-content:flex-start;overflow-y:auto;padding-top:10px}
    #overlay h1{font-size:34px;margin-bottom:4px}
    #overlay p{font-size:calc(11px*var(--fs));line-height:1.45;margin:3px 0}
    #overlay .go{margin-top:10px}
    #info{font-size:calc(10px*var(--fs))}
  }
</style>
</head>
<body>
@@TOPBAR_BODY@@
<canvas id="gl"></canvas>
<canvas id="noise" width="200" height="112"></canvas>
<div id="vign"></div>
<div id="flash"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="touch"><div id="stickBase"><div id="stickRun"></div><div id="stickKnob"></div></div><div id="lookHint"></div><div id="echoBtn"></div></div>
<div id="info"></div>
<div id="overlay"></div>
<div id="tune"></div>
<canvas id="map" width="300" height="300"></canvas>
<div id="cheats"></div>
<div id="rotate"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="5" fill="none" stroke="#9fd8ff" stroke-width="3"/><circle cx="32" cy="51" r="2.5" fill="#9fd8ff"/></svg><div id="rotT"></div><p id="rotP"></p></div>
<script>
'use strict';
// safety net: on any error, free the mouse and say what happened
function crash(msg){ try{ document.exitPointerLock&&document.exitPointerLock(); }catch(e){}
  const o=document.getElementById('overlay'); if(!o) return;
  ovState={k:'error',msg}; try{ o.innerHTML=overlayHTML(ovState); }catch(e){ o.textContent=String(msg); } o.style.display='flex'; }
// no WebGL: the page shows its NO WEBGL screen and stops quietly (no error report, no ERROR screen on top)
window.addEventListener('error',e=>{ if(ovState&&ovState.k==='noGL'){ e.preventDefault(); return; } crash(e.message); });
window.addEventListener('unhandledrejection',e=>crash(e.reason));
// =====================================================================
//  TEXTS (EN/ES/DE; L102 = the shared level102 top bar)
// =====================================================================
const isTouch=matchMedia('(pointer:coarse)').matches||(('ontouchstart' in window)&&navigator.maxTouchPoints>0);
if(isTouch) document.documentElement.classList.add('touch');
const STR={
 en:{intro1:'You cannot see. Click your tongue to see.',
  intro2:'Something lives in these halls. It cannot see either, but it hears everything. Echo too close, or too often, and it will come. When it runs, it screams. When it screams, others answer.',

  ctlTouch:'<kbd>LEFT THUMB</kbd> move · push it past the dashed ring to <kbd>RUN</kbd> · <kbd>RIGHT THUMB</kbd> drag to look, tap <kbd>ECHO</kbd> to echolocate · headphones recommended',
  fsNote:'Plays in full screen, with the phone sideways.',
  begin:['CLICK TO BEGIN','TAP TO BEGIN'],prompt:['PRESS [ SPACE ]','TAP [ ECHO ]'],
  info1:'<b>FIND THE EXIT</b> — follow the green signs',
  infoPC:'<kbd>WASD</kbd> move &nbsp; <kbd>MOUSE</kbd> look &nbsp; <kbd>SHIFT</kbd> run (loud)<br><kbd>SPACE</kbd> echolocate — they hear echoes &amp; running; when they click, freeze.',
  infoTouch:'left thumb: move, push far to run · right thumb: drag to look, tap ECHO to echolocate<br>they hear echoes &amp; running; when they click, freeze.',
  paused:'PAUSED',pausedMsg:'The dark waits.',resume:['CLICK TO RESUME','TAP TO RESUME'],
  won:'ESCAPED',wonMsg:'You found the exit in {s} s.',again:['CLICK TO PLAY AGAIN','TAP TO PLAY AGAIN'],
  dead:'CONSUMED',deadMsg:'It heard you.',retry:['CLICK TO TRY AGAIN','TAP TO TRY AGAIN'],
  error:'ERROR',restart:['CLICK TO RESTART','TAP TO RESTART'],
  noGL:'NO WEBGL',noGLMsg:'This browser has WebGL turned off. Try Chrome or Firefox with hardware acceleration on.',
  rot:'TURN YOUR PHONE SIDEWAYS',rotMsg:'Echoloc is played in landscape.',rotTap:'Or tap here to play in full screen.',run:'RUN',look:'DRAG<br>TO LOOK',echo:'ECHO',
  dbgOn:'EYES OPEN',dbgOff:'EYES CLOSED',
  secret:'A secret for those who escape: type <kbd>LETMESEE</kbd> (no spaces) while playing and you will open your eyes, and see what is really out there. Type it again to close them.',
  secretTouch:'A secret for those who escape: you can open your eyes, and see what is really out there.',eyes:['OPEN YOUR EYES','CLOSE YOUR EYES'],howTo:'HOW TO PLAY'},
 es:{intro1:'No puedes ver. Chasquea la lengua para ver.',
  intro2:'Algo vive en estos pasillos. Tampoco ve, pero lo oye todo. Si haces eco demasiado cerca o demasiado a menudo, vendrá. Cuando corre, chilla. Cuando chilla, otros responden.',
  ctlPC:'<kbd>WASD</kbd> moverte · <kbd>RATÓN</kbd> mirar · <kbd>MAYÚS</kbd> correr · <kbd>ESPACIO</kbd> ecolocalizar · <kbd>F</kbd> pantalla completa · mejor con auriculares',
  ctlTouch:'<kbd>PULGAR IZQUIERDO</kbd> moverte · empújalo más allá del anillo discontinuo para <kbd>CORRER</kbd> · <kbd>PULGAR DERECHO</kbd> arrastra para mirar, toca <kbd>ECO</kbd> para ecolocalizar · mejor con auriculares',
  fsNote:'Se juega en pantalla completa, con el móvil en horizontal.',
  begin:['HAZ CLIC PARA EMPEZAR','TOCA PARA EMPEZAR'],prompt:['PULSA [ ESPACIO ]','TOCA [ ECO ]'],
  info1:'<b>ENCUENTRA LA SALIDA</b>: sigue las señales verdes',
  infoPC:'<kbd>WASD</kbd> moverte &nbsp; <kbd>RATÓN</kbd> mirar &nbsp; <kbd>MAYÚS</kbd> correr (hace ruido)<br><kbd>ESPACIO</kbd> ecolocalizar: oyen los ecos y las carreras; cuando chasquean, quieto.',
  infoTouch:'pulgar izquierdo: moverte, empuja lejos para correr · pulgar derecho: arrastra para mirar, toca ECO para ecolocalizar<br>oyen los ecos y las carreras; cuando chasquean, quieto.',
  paused:'PAUSA',pausedMsg:'La oscuridad espera.',resume:['HAZ CLIC PARA SEGUIR','TOCA PARA SEGUIR'],
  won:'ESCAPASTE',wonMsg:'Encontraste la salida en {s} s.',again:['HAZ CLIC PARA JUGAR OTRA VEZ','TOCA PARA JUGAR OTRA VEZ'],
  dead:'DEVORADO',deadMsg:'Te ha oído.',retry:['HAZ CLIC PARA REINTENTAR','TOCA PARA REINTENTAR'],
  error:'ERROR',restart:['HAZ CLIC PARA REINICIAR','TOCA PARA REINICIAR'],
  noGL:'SIN WEBGL',noGLMsg:'Este navegador tiene WebGL desactivado. Prueba Chrome o Firefox con la aceleración por hardware activada.',
  rot:'GIRA EL MÓVIL',rotMsg:'Echoloc se juega en horizontal.',rotTap:'O toca aquí para jugar en pantalla completa.',run:'CORRER',look:'ARRASTRA<br>PARA MIRAR',echo:'ECO',
  dbgOn:'OJOS ABIERTOS',dbgOff:'OJOS CERRADOS',
  secret:'Un secreto para quien escapa: escribe <kbd>LETMESEE</kbd> (sin espacios) mientras juegas y abrirás los ojos, y verás lo que hay de verdad ahí fuera. Escríbelo otra vez para cerrarlos.',
  secretTouch:'Un secreto para quien escapa: puedes abrir los ojos y ver lo que hay de verdad ahí fuera.',eyes:['ABRE LOS OJOS','CIERRA LOS OJOS'],howTo:'CÓMO SE JUEGA'},
 de:{intro1:'Du kannst nichts sehen. Schnalze mit der Zunge, um zu sehen.',
  intro2:'Etwas lebt in diesen Gängen. Es kann auch nicht sehen, aber es hört alles. Ein Echo zu nah oder zu oft, und es kommt. Wenn es rennt, kreischt es. Wenn es kreischt, antworten andere.',
  ctlPC:'<kbd>WASD</kbd> gehen · <kbd>MAUS</kbd> umsehen · <kbd>SHIFT</kbd> rennen · <kbd>LEERTASTE</kbd> Echo · <kbd>F</kbd> Vollbild · am besten mit Kopfhörern',
  ctlTouch:'<kbd>LINKER DAUMEN</kbd> gehen · über den gestrichelten Ring hinaus schieben zum <kbd>RENNEN</kbd> · <kbd>RECHTER DAUMEN</kbd> ziehen zum Umsehen, <kbd>ECHO</kbd> antippen für ein Echo · am besten mit Kopfhörern',
  fsNote:'Wird im Vollbild und mit quer gehaltenem Handy gespielt.',
  begin:['KLICKEN ZUM STARTEN','TIPPEN ZUM STARTEN'],prompt:['DRÜCKE [ LEERTASTE ]','TIPPE [ ECHO ]'],
  info1:'<b>FINDE DEN AUSGANG</b>: folge den grünen Schildern',
  infoPC:'<kbd>WASD</kbd> gehen &nbsp; <kbd>MAUS</kbd> umsehen &nbsp; <kbd>SHIFT</kbd> rennen (laut)<br><kbd>LEERTASTE</kbd> Echo: sie hören Echos und Rennen; wenn sie klicken, erstarre.',
  infoTouch:'linker Daumen: gehen, weit schieben zum Rennen · rechter Daumen: ziehen zum Umsehen, ECHO antippen für ein Echo<br>sie hören Echos und Rennen; wenn sie klicken, erstarre.',
  paused:'PAUSE',pausedMsg:'Die Dunkelheit wartet.',resume:['KLICKEN ZUM WEITERSPIELEN','TIPPEN ZUM WEITERSPIELEN'],
  won:'ENTKOMMEN',wonMsg:'Du hast den Ausgang in {s} s gefunden.',again:['KLICKEN FÜR EIN NEUES SPIEL','TIPPEN FÜR EIN NEUES SPIEL'],
  dead:'GEFRESSEN',deadMsg:'Es hat dich gehört.',retry:['KLICKEN FÜR EINEN NEUEN VERSUCH','TIPPEN FÜR EINEN NEUEN VERSUCH'],
  error:'FEHLER',restart:['KLICKEN ZUM NEUSTART','TIPPEN ZUM NEUSTART'],
  noGL:'KEIN WEBGL',noGLMsg:'In diesem Browser ist WebGL ausgeschaltet. Probiere Chrome oder Firefox mit eingeschalteter Hardwarebeschleunigung.',
  rot:'HANDY QUER HALTEN',rotMsg:'Echoloc wird im Querformat gespielt.',rotTap:'Oder hier tippen, um im Vollbild zu spielen.',run:'RENNEN',look:'ZIEHEN ZUM<br>UMSEHEN',echo:'ECHO',
  dbgOn:'AUGEN AUF',dbgOff:'AUGEN ZU',
  secret:'Ein Geheimnis für alle, die entkommen: Tippe beim Spielen <kbd>LETMESEE</kbd> (ohne Leerzeichen), dann öffnest du die Augen und siehst, was da draußen wirklich ist. Nochmal tippen schließt sie wieder.',
  secretTouch:'Ein Geheimnis für alle, die entkommen: Du kannst die Augen öffnen und sehen, was da draußen wirklich ist.',eyes:['AUGEN ÖFFNEN','AUGEN SCHLIESSEN'],howTo:'SO WIRD GESPIELT'}};
const lang=()=>(window.L102&&STR[L102.lang])?L102.lang:'en';
function T(k,a){ let v=STR[lang()][k]; if(Array.isArray(v)) v=v[isTouch?1:0]; if(a) for(const n in a) v=v.replace('{'+n+'}',a[n]); return v; }
// the overlay is described by a state so a language switch can redraw it in place
let ovState={k:'start'};
function overlayHTML(st){
  if(st.k==='start') return `<h1>ECHOLOC</h1><p>${T('intro1')}</p><p>${T('intro2')}</p><p id="ctl">${T(isTouch?'ctlTouch':'ctlPC')}</p>`
    +(isTouch&&fsSupported?`<div class="sub">${T('fsNote')}</div>`:'')+`<div class="go">${T('begin')}</div>`;
  const M={paused:['','pausedMsg','resume'],won:['green','wonMsg','again'],dead:['red','deadMsg','retry'],error:['red',null,'restart'],noGL:['red','noGLMsg',null]}[st.k];
  const msg=M[1]?T(M[1],st.a):String(st.msg).replace(/</g,'&lt;');
  const eyesBtn=isTouch&&(st.k==='won'||(st.k==='paused'&&hasEscaped()))?`<button type="button" class="eyesBtn" id="eyesBtn">${STR[lang()].eyes[debugView?1:0]}</button>`:'';
  const secret=st.k==='won'?`<p class="secret">${T(isTouch?'secretTouch':'secret')}</p>`:'';
  // full screen hides the top bar: its help moves onto the pause screen
  const helpBtn=st.k==='paused'&&typeof isFS==='function'&&isFS()?`<button type="button" class="eyesBtn helpBtn" id="helpBtn">${T('howTo')}</button>`:'';
  return `<h1 class="${M[0]}">${T(st.k)}</h1><p>${msg}</p>${secret}${eyesBtn}${helpBtn}${M[2]?`<div class="go">${T(M[2])}</div>`:''}`;
}
// the LETMESEE secret: lit view of the level and the monsters (for players who have escaped once)
function hasEscaped(){ try{ return localStorage.getItem('echoloc.escaped')==='1'; }catch(e){ return false; } }
function toggleEyes(){ debugView=!debugView; if(debugView&&BX) buildLitMesh(); toast(T(debugView?'dbgOn':'dbgOff')); }
function paintTexts(){
  const o=document.getElementById('overlay'); if(o) o.innerHTML=overlayHTML(ovState);
  document.getElementById('prompt').textContent=T('prompt');
  document.getElementById('info').innerHTML=T('info1')+'<br>'+T(isTouch?'infoTouch':'infoPC');
  document.getElementById('stickRun').textContent=T('run'); document.getElementById('lookHint').innerHTML=T('look'); document.getElementById('echoBtn').textContent=T('echo');
  document.getElementById('rotT').textContent=T('rot'); document.getElementById('rotP').textContent=T('rotMsg')+(fsSupported?' '+T('rotTap'):'');
  document.title='Echoloc';
}
addEventListener('l102:lang',paintTexts);
// =====================================================================
//  TUNING (cheat "letmechoose": sliders for all of these, for this session only; "reset" then starts a new game)
// =====================================================================
const TUNE_DEF=[
 ['You'],
 ['walk',2.4,1,5,0.1,'walk speed (m/s)'],['run',5.9,3,10,0.1,'run speed (m/s)'],['tireTime',6,1,30,0.5,'running until exhausted (s)'],
 ['recover',1,0.2,5,0.1,'tiredness recovers ×'],['look',1,0.3,3,0.05,'look sensitivity ×'],
 ['Your echo'],
 ['echoRays',1,0.2,3,0.05,'echo dots ×'],['echoRange',36,10,80,1,'echo range (m)'],['echoSpeed',24,8,80,1,'echo wave speed (m/s)'],

function addBox(x0,y0,z0,x1,y1,z1,kind){

    for(let x=Math.floor(x0);x<=Math.floor(x1-1e-4);x++){

  const seg=(a,b,c,d)=>{ if(rnd()<.5){carveH(a,c,b,w);carveV(b,d,c,w);} else {carveV(b,d,a,w);carveH(a,c,d,w);} };

function carveCorridor(A,B,main){ carveBetween(Math.floor(A.cx),Math.floor(A.cz),Math.floor(B.cx),Math.floor(B.cz),main); }

function bfs(startI, grid){
  const d=new Int16Array(W*H).fill(-1), q=new Int32Array(W*H); let h=0,t=0;

  while(h<t){ const c=q[h++], cx=c%W, cz=(c/W)|0, nd=d[c]+1;
    if(cx>0   &&grid[c-1]&&d[c-1]<0){d[c-1]=nd;q[t++]=c-1;}
    if(cx<W-1 &&grid[c+1]&&d[c+1]<0){d[c+1]=nd;q[t++]=c+1;}
    if(cz>0   &&grid[c-W]&&d[c-W]<0){d[c-W]=nd;q[t++]=c-W;}
    if(cz<H-1 &&grid[c+W]&&d[c+W]<0){d[c+W]=nd;q[t++]=c+W;}

function reachCount(){ const d=bfs(startCell,walk); let n=0; for(let i=0;i<d.length;i++) if(d[i]>=0) n++; return n; }

function tryPlace(cells, bx){
  for(const c of cells) if(c<0||!walk[c]||reserved[c]) return false;
  for(const c of cells) walk[c]=0;
  walkCount-=cells.length;
  if(reachCount()!==walkCount){ for(const c of cells) walk[c]=1; walkCount+=cells.length; return false; }
  for(const b of bx) addBox(b[0],b[1],b[2],b[3],b[4],b[5],K_FURN);
  for(const c of cells){ const cx=c%W, cz=(c/W)|0; let x0=1e9,z0=1e9,x1=-1e9,z1=-1e9;
    for(const b of bx){ if(b[1]>1.6) continue; x0=Math.min(x0,Math.max(b[0],cx)); z0=Math.min(z0,Math.max(b[2],cz)); x1=Math.max(x1,Math.min(b[3],cx+1)); z1=Math.max(z1,Math.min(b[5],cz+1)); }
    if(x1<x0){ x0=cx;z0=cz;x1=cx+1;z1=cz+1; } footprint[c*4]=x0; footprint[c*4+1]=z0; footprint[c*4+2]=x1; footprint[c*4+3]=z1; }

function tryGen(){

    for(const r of pool){ let m=0; if(nr<2&&r.w*r.h>=48){m=1;nr++;} else if(nc<3){m=2;nc++;} else continue; r.mat=m;
      for(let z=r.z;z<r.z+r.h;z++) for(let x=r.x;x<r.x+r.w;x++) mat[idx(x,z)]=m; } }

// Exit signs are fixed 3D objects: a double-sided blade sign hanging from the ceiling, aligned with the exit

const SIGN_L=0.5, SIGN_H=0.16, SIGN_T=0.04;
function revealSign(s, appear){
  const GR=[0.25,1,0.4], ux=s.dx, uz=s.dz, nx=-uz, nz=ux;
  const P=(x,y,z,b)=>pushPt(x+(Math.random()-.5)*0.006,y+(Math.random()-.5)*0.006,z+(Math.random()-.5)*0.006,GR[0]*b,GR[1]*b,GR[2]*b,appear+Math.random()*0.02,1.5,0);
  const ps=0.045;
  for(const side of [1,-1]){
    const fnx=nx*side, fnz=nz*side, rx=fnz, rz=-fnx;            // this face's normal and its reader's right
    const ox=s.x+fnx*(SIGN_T+0.006), oz=s.z+fnz*(SIGN_T+0.006);
    const ar=(ux*rx+uz*rz)>0?1:-1;                                // world exit dir is to reader's right(+1) or left(-1)
    const tu0=ar>0?-0.47:-0.205, cu=ar>0?0.33:-0.33;
    const F=(u,v,b)=>P(ox+rx*u, s.y+v, oz+rz*u, b);
    for(const [c,r] of EXIT_TXT.px) for(let k=0;k<4;k++) F(tu0+(c+Math.random())*ps, -0.11+(r+Math.random())*ps, 1.3);
    const tip=cu+0.12*ar;
    for(let k=0;k<36;k++) F(cu-0.12*ar+0.24*ar*k/35, 0, 1.4);
    for(const sg of [-1,1]) for(let k=0;k<14;k++){ const t=k/13; F(tip-0.085*ar*t, 0.075*sg*t, 1.4); }
    for(let k=0;k<50;k++) F(MR(-SIGN_L,SIGN_L), MR(-SIGN_H,SIGN_H), 0.18);

  const C=(a,v,n)=>[s.x+ux*SIGN_L*a+nx*SIGN_T*n, s.y+SIGN_H*v, s.z+uz*SIGN_L*a+nz*SIGN_T*n];
  const E=(A,B,n)=>{ for(let k=0;k<n;k++){ const t=Math.random(); P(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t,0.55); } };
  for(const v of [-1,1]) for(const n of [-1,1]) E(C(-1,v,n),C(1,v,n),26);
  for(const a of [-1,1]) for(const n of [-1,1]) E(C(a,-1,n),C(a,1,n),9);
  for(const a of [-1,1]) for(const v of [-1,1]) E(C(a,v,-1),C(a,v,1),3);
  for(const a of [-0.8,0.8]) E([s.x+ux*SIGN_L*a, s.y+SIGN_H, s.z+uz*SIGN_L*a],[s.x+ux*SIGN_L*a, s.top, s.z+uz*SIGN_L*a],14); // hanging wires
}
function revealFloorArrow(s, appear){

function makeMonster(x,z){
  return {x,z,yaw:rnd()*6.283,state:'idle',curSpeed:0,gait:rnd()*6,runB:0,target:null,susp:0,heardT:-99,lastKnown:null,
    shriekT:0,wanderT:R(1,5),lingerT:0,freezeT:0,twX:0,twRoll:0,twT:0,armJ:[[0,0,0],[0,0,0]],jaw:0,seed:rnd()*100,

function ik(a,b,L,bend){ const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,mz=(a[2]+b[2])/2; const d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);

  const pel=[0,1.2-run*0.34+bob,0];
  const che=[Math.sin(now*1.3+m.seed)*0.04, pel[1]+Math.cos(lean)*0.62, Math.sin(lean)*0.62];
  const nk=[che[0]+m.twX*0.05, che[1]+Math.cos(lean+0.5)*m.neck, che[2]+Math.sin(lean+0.5)*m.neck+D*0.35];
  const hd=[nk[0]+m.twX*0.13, nk[1]+0.09-run*0.05+D*0.08, nk[2]+0.12+D*0.3];
  const L=[[pel,che,0.13],[che,nk,0.06],[nk,hd,0.04]];
  L.push([[che[0]-0.24,che[1]-0.05,che[2]],[che[0]+0.24,che[1]-0.05,che[2]],0.06]); // shoulders
  for(let k=0;k<4;k++){ const y=lerp(pel[1],che[1],0.35+k*0.15), zz=lerp(0,che[2],0.35+k*0.15); L.push([[-0.15,y,zz+0.05],[0.15,y,zz+0.05],0.025]); } // ribs

    const hip=[sg*0.13,pel[1]-0.03,0], stride=(0.22+run*0.45)*mv;
    const foot=[sg*0.2, Math.max(0,Math.sin(ph))*(0.12+run*0.2)*mv, Math.cos(ph)*stride];
    const knee=ik(hip,foot,0.64,[0,0.15,-1]);

    const hR=[sg*(0.35+0.12*Math.sin(now*9+sg)), sh[1]-0.35+Math.sin(ph)*0.28, sh[2]+0.75+Math.cos(ph)*0.22];
    const hD=[sg*(0.55-D*0.25), sh[1]+0.25, sh[2]+0.75+D*0.2];

// can you see any part of it? the chest first (cheap), then head, hands, elbows, knees, feet... a hand sticking out
// past a corner counts. The parts that are behind walls are hidden by the depth pass when drawn.
function seesMonster(m){
  if(los(player.x,camY,player.z,m.x,1.4,m.z)) return true;
  const P=poseOf(m), h=P.head;
  if(los(player.x,camY,player.z,h[0],h[1],h[2])) return true;
  for(const sg of P.segs) for(const q of [sg[0],sg[1]]) if(los(player.x,camY,player.z,q[0],Math.max(0.05,q[1]),q[2])) return true;

function sampleMonster(m,n,appear,life,col,flags){
  const P=poseOf(m); const segs=P.segs;
  let tot=0; const w=segs.map(([a,b,r])=>{const l=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]); tot+=l*(r+0.03); return tot;});
  const nb=Math.floor(n*0.68);
  for(let i=0;i<nb;i++){
    const q=Math.random()*tot; let k=0; while(w[k]<q) k++;
    const [a,b,r]=segs[k]; const t=Math.random();
    let ax=b[0]-a[0],ay=b[1]-a[1],az=b[2]-a[2]; const al=Math.hypot(ax,ay,az)||1; ax/=al;ay/=al;az/=al;
    let vx=Math.random()-.5,vy=Math.random()-.5,vz=Math.random()-.5; const dp=vx*ax+vy*ay+vz*az; vx-=ax*dp;vy-=ay*dp;vz-=az*dp;
    const vl=Math.hypot(vx,vy,vz)||1; const rr=r*(0.85+Math.random()*0.3)/vl;
    const br=0.6+Math.random()*0.5;
    pushPt(a[0]+(b[0]-a[0])*t+vx*rr, a[1]+(b[1]-a[1])*t+vy*rr, a[2]+(b[2]-a[2])*t+vz*rr, col[0]*br,col[1]*br,col[2]*br, appear+Math.random()*0.01, life, flags);
  }
  const h=P.head,F=P.HF,Rr=P.HR,U=P.HU, jaw=m.jaw;
  const at=(o,a,b,c)=>[o[0]+Rr[0]*a+U[0]*b+F[0]*c, o[1]+Rr[1]*a+U[1]*b+F[1]*c, o[2]+Rr[2]*a+U[2]*b+F[2]*c];
  const jc=at(h,0,-0.09-jaw*0.12,0.03+jaw*0.05);
  const nh=n-nb;
  for(let i=0;i<nh;i++){
    let x=Math.random()-.5,y=Math.random()-.5,z=Math.random()-.5; const l=Math.hypot(x,y,z)||1; x/=l;y/=l;z/=l;
    const sel=Math.random(); let p, br=0.6+Math.random()*0.5, c=col;
    if(sel<0.6){ if(jaw>0.15&&z>0.2&&y<0.15) continue; p=at(h,x*0.11,y*0.16+0.03,z*0.13); }
    else if(sel<0.82){ if(y>0.35) continue; p=at(jc,x*0.09,y*0.05,z*0.11); }
    else { if(jaw<0.15) continue; const a=(Math.random()-.5)*2.4, up=Math.random()<.5, tl=Math.random();
      const base=up?at(h,Math.sin(a)*0.09,-0.06-tl*(0.04+jaw*0.04),Math.cos(a)*0.1):at(jc,Math.sin(a)*0.08,0.04+tl*(0.04+jaw*0.04),Math.cos(a)*0.09);
      p=base; c=[1,1,1]; br=1.3; }
    pushPt(p[0],p[1],p[2],c[0]*br,c[1]*br,c[2]*br,appear+Math.random()*0.01,life,flags);

}

// nav
const navCache=new Map();
function getNav(ti){ let d=navCache.get(ti); if(!d){ d=bfs(ti,walk); navCache.set(ti,d); if(navCache.size>80) navCache.delete(navCache.keys().next().value); } return d; }
function clearPath(ax,az,bx,bz,avoid){ const dx=bx-ax,dz=bz-az,L=Math.hypot(dx,dz); if(L<0.01) return true; const n=Math.ceil(L/0.25), px=-dz/L*0.3, pz=dx/L*0.3;
  for(let i=0;i<=n;i++){ const x=ax+dx*i/n,z=az+dz*i/n; if(!walkAt(x,z)||!walkAt(x+px,z+pz)||!walkAt(x-px,z-pz)) return false; if(avoid&&matAt(x,z)===1) return false; } return true; }
// calm monsters won't walk into reverb rooms (too loud in there) unless they are already inside -- whatever path is chosen
function navDir(m,tx,tz){ const r=navDir0(m,tx,tz);
  if(r&&m.state!=='hunt'&&matAt(m.x,m.z)!==1&&(matAt(m.x+r[0]*0.6,m.z+r[1]*0.6)===1||matAt(m.x+r[0]*0.3,m.z+r[1]*0.3)===1)) return null;
  return r; }
function navDir0(m,tx,tz){
  const avoid=m.state!=='hunt'&&matAt(m.x,m.z)!==1;
  let dx=tx-m.x,dz=tz-m.z; const dl=Math.hypot(dx,dz)||1;
  if(dl<1.0&&!(avoid&&matAt(tx,tz)===1)) return [dx/dl,dz/dl];
  if(clearPath(m.x,m.z,tx,tz,avoid)) return [dx/dl,dz/dl];
  const ti=idx(Math.floor(tx),Math.floor(tz)); if(!walk[ti]) return [dx/dl,dz/dl];
  const d=getNav(ti), ci=idx(Math.floor(m.x),Math.floor(m.z)); if(d[ci]<0) return [dx/dl,dz/dl];
  let cur=ci, goal=-1;
  for(let s=0;s<8;s++){ let best=cur,bd=d[cur];
    for(const o of [1,-1,W,-W]){ const n=cur+o; if(n>=0&&n<W*H&&d[n]>=0&&d[n]<bd&&!(avoid&&mat[n]===1)){bd=d[n];best=n;} }
    if(best===cur) break; cur=best;
    const gx=cur%W+0.5,gz=((cur/W)|0)+0.5;
    if(goal<0||clearPath(m.x,m.z,gx,gz,avoid)) goal=cur; else break; }
  if(goal<0) return avoid?null:[dx/dl,dz/dl];
  dx=goal%W+0.5-m.x; dz=((goal/W)|0)+0.5-m.z; const l=Math.hypot(dx,dz)||1; return [dx/l,dz/l];
}

function enterAlert(m,x,z){ if(m.state==='hunt'||m.state==='kill') return; const was=m.state; m.state='alert'; m.target={x,z}; m.lingerT=0; m.freezeT=R(0.3,0.9);
  if(was==='idle') sfxChitter([m.x,1.8,m.z],0.9); }
// enterHunt(m): it heard/sensed you itself -> knows where you are now and which way you were going.
// enterHunt(m,pos,t): told by another monster's scream or by the level's heat -> only that (maybe stale) spot, no heading;
// ignored by a hunter that already has fresher information. Nothing ever hands them your live position: hiding works.
function enterHunt(m,pos,t){ if(m.state==='kill') return;
  if(pos&&m.state==='hunt'&&m.heardT>=t) return;
  if(m.state!=='hunt'){ m.state='hunt'; m.windup=1.0; m.wShriek=true; m.shriekT=R(1.6,3.2); m.freezeT=0; }
  m.overshot=false;
  if(pos){ m.heardT=t; m.lastKnown={x:pos.x,z:pos.z}; m.lastDir=null; return; }
  m.heardT=now; m.lastKnown={x:player.x,z:player.z}; noteHeard();
  const v=Math.hypot(player.vx||0,player.vz||0); m.lastDir=v>0.6?{x:player.vx/v,z:player.vz/v}:null; }
// the last time and place any monster actually heard or sensed you (what the level's "heat" can know)
let lastNoise={x:0,z:0,t:-99};
function noteHeard(){ lastNoise={x:player.x,z:player.z,t:now}; }

// sound the player made at (x,z): kind 'echo' or 'step'
// Sounds the player makes have a power that falls off with distance (walls muffle).
// faint -> curious (walks toward the sound); clear, or several in a row -> shriek & chase.
// heard with a clear line: it knows where you are and which way you go. Heard round corners/through walls: only roughly
// where (2-8 m off, more the farther), no heading -- so it goes to about where it last heard you and has to search there.
function roughly(d){ const e=clamp(d*TUNE.rough,TUNE.rough*8,TUNE.rough*32); for(let t=0;t<12;t++){ const x=player.x+MR(-e,e), z=player.z+MR(-e,e); if(walkAt(x,z)) return {x,z}; } return {x:player.x,z:player.z}; }

    const clear=los(player.x,EYE,player.z,m.x,1.5,m.z), eff=d*(clear?1:TUNE.walls);   // walls and corners muffle a lot
    const pm=matAt(player.x,player.z); const e2=eff*(pm===1?0.75:pm===2?(kind==='step'?1.6:1.25):1); // reverb carries, carpet muffles

    if(clear) noteHeard();

const player={x:0,z:0,yaw:0,pitch:0,bob:0};

function solidAt(cx,cz){ return !inb(cx,cz)||!walk[idx(cx,cz)]; }
function collide(o,r){

    for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){ const X=cx+dx,Z=cz+dz; if(!solidAt(X,Z)) continue;

// newer browsers return a promise that rejects when the lock is refused (too soon after Esc, other window...): not an error
function lockMouse(){ try{ const p=cv.requestPointerLock&&cv.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
cv.addEventListener('click',()=>{ if(canSkipDeath()) play(); else if(!isTouch&&started&&!dead&&!won) lockMouse(); });

  if(isTouch) return;

  else if(document.pointerLockElement===cv) paused=false;
});
// ---------------- mobile: touch joypad + fullscreen ----------------
// left thumb: floating stick (inner ring walk, past the dashed outer ring run); right thumb: drag looks; the ECHO button echoes,
// but only when a touch STARTS on it (sliding onto it while looking does nothing)
const ECHO_RAYS=isTouch?11000:20000;
const fsSupported=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const lockLandscape=()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} };
function goFS(){ const el=document.documentElement; try{ const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:'hide'});
  if(p&&p.then) p.then(lockLandscape).catch(()=>{}); else lockLandscape(); }catch(e){} }
const isPortrait=()=>isTouch&&innerHeight>innerWidth;
const touchEl=document.getElementById('touch'), stickBase=document.getElementById('stickBase'), stickKnob=document.getElementById('stickKnob'), lookHint=document.getElementById('lookHint'), echoBtn=document.getElementById('echoBtn');
const stick={id:null,ox:0,oy:0,x:0,y:0,run:false}, look={id:null,lx:0,ly:0}, STICK_R=58, RUN_R=84, KNOB_MAX=104;
function restStick(){ stickBase.style.left=Math.max(120,innerWidth*0.16)+'px'; stickBase.style.top=(innerHeight-Math.max(118,innerHeight*0.27))+'px';
  stickKnob.style.transform=''; stickKnob.classList.remove('run'); stickBase.classList.remove('run'); stickBase.style.opacity=0.55; }
restStick(); addEventListener('resize',()=>{ restStick(); if(isPortrait()&&canPlay()){ paused=true; showOverlay('paused'); } });
const canPlay=()=>started&&!paused&&!dead&&!won;
touchEl.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  for(const t of e.changedTouches){
    if(t.target===echoBtn){ if(canPlay()) playerEcho(false); echoBtn.classList.add('on'); setTimeout(()=>echoBtn.classList.remove('on'),150); continue; }
    if(t.clientX<innerWidth*0.45&&stick.id===null){ stick.id=t.identifier; stick.ox=t.clientX; stick.oy=t.clientY; stick.x=stick.y=0; stick.run=false;
      stickBase.style.left=t.clientX+'px'; stickBase.style.top=t.clientY+'px'; stickBase.style.opacity=1; }
    else if(t.clientX>=innerWidth*0.45&&look.id===null){ look.id=t.identifier; look.lx=t.clientX; look.ly=t.clientY; } } },{passive:false});
touchEl.addEventListener('touchmove',e=>{ e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===stick.id){ let dx=t.clientX-stick.ox, dy=t.clientY-stick.oy; const l=Math.hypot(dx,dy);
      if(l>KNOB_MAX){dx*=KNOB_MAX/l;dy*=KNOB_MAX/l;}
      const m=Math.min(l,STICK_R)/STICK_R/(l||1); stick.x=dx*m; stick.y=dy*m;   // direction, full speed at the inner ring
      stick.run=l>RUN_R; stickKnob.classList.toggle('run',stick.run); stickBase.classList.toggle('run',stick.run);
      stickKnob.style.transform=`translate(${dx}px,${dy}px)`; }
    else if(t.identifier===look.id){ if(!dead){ player.yaw-=(t.clientX-look.lx)*0.0065*TUNE.look; player.pitch=clamp(player.pitch-(t.clientY-look.ly)*0.0065*TUNE.look,-1.45,1.45); }
      look.lx=t.clientX; look.ly=t.clientY; } } },{passive:false});
function touchEnd(e){ e.preventDefault(); for(const t of e.changedTouches){
  if(t.identifier===stick.id){ stick.id=null; stick.x=stick.y=0; stick.run=false; restStick(); }
  if(t.identifier===look.id) look.id=null; } }
touchEl.addEventListener('touchend',touchEnd,{passive:false}); touchEl.addEventListener('touchcancel',touchEnd,{passive:false});
// phones: leaving full screen (back button) or turning upright pauses; going full screen (also from the top bar) turns sideways
function onFS(){ if(isFS()){ if(isTouch) lockLandscape(); } else if(isTouch&&canPlay()){ paused=true; showOverlay('paused'); } }
document.addEventListener('fullscreenchange',onFS); document.addEventListener('webkitfullscreenchange',onFS);
document.getElementById('rotate').addEventListener('click',()=>{ if(fsSupported&&!isFS()) goFS(); });
// the top bar's help panel pauses the game
addEventListener('l102:help',e=>{ if(e.detail&&canPlay()){ paused=true; showOverlay('paused'); } });
// letmechoose panel: sliders change the values live; buttons copy / defaults / new game / close
{ const el=document.getElementById('tune');
  el.addEventListener('input',e=>{ const row=e.target.closest('.tuneRow'); if(!row) return; const k=row.dataset.k, d=TUNE_DEF.find(x=>x[0]===k);
    TUNE[k]=+e.target.value; row.querySelector('output').textContent=TUNE[k]; row.classList.toggle('changed',TUNE[k]!==d[1]); applyTune(); });
  el.addEventListener('click',e=>{ const a=e.target.dataset&&e.target.dataset.a; if(!a) return;
    if(a==='export'){ const t=tuneExport(), out=el.querySelector('.tuneOut'); out.value=t; out.select(); try{ navigator.clipboard.writeText(t).then(()=>toast('EXPORTED + COPIED'),()=>toast('EXPORTED')); }catch(err){ toast('EXPORTED'); } }
    else if(a==='import'){ const v=el.querySelector('.tuneOut').value; if(tuneImport(v)){ openTune(); el.querySelector('.tuneOut').value=v; toast('IMPORTED'); } else toast('NOT A VALID STRING'); }
    else if(a==='def'){ for(const d of TUNE_DEF) if(d.length>1) TUNE[d[0]]=d[1]; applyTune(); openTune(); }
    else if(a==='new') tuneNewGame();
    else if(a==='close') closeTune(); });
}
let lastTouchUI='';
function updateTouchUI(){ const ovHidden=document.getElementById('overlay').style.display==='none';
  const st=(isTouch&&started&&ovHidden&&!paused&&!dead&&!won?'1':'0');
  if(st===lastTouchUI) return; lastTouchUI=st; touchEl.style.display=st==='1'?'block':'none';
  if(st==='1'){ lookHint.style.opacity=1; clearTimeout(updateTouchUI.h); updateTouchUI.h=setTimeout(()=>lookHint.style.opacity=0.25,9000); } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&started&&!dead&&!won&&!paused){ paused=true; showOverlay('paused'); } });
paintTexts(); document.getElementById('overlay').style.display='flex';
let last=performance.now();
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000); last=ts;
  requestAnimationFrame(frame);
  const tA=performance.now();
  try{
    if(started&&(!paused||dead)){ now+=dt; update(dt); }
    const tB=performance.now(); processEchoJobs(); const tC=performance.now();
    updateListener(); audioWatch(); render(); drawNoise(); drawMap(); updateTouchUI();
    const other=(tB-tA)+(performance.now()-tC); otherWorkEMA=otherWorkEMA*0.9+other*0.1;
    echoBudget=clamp(FRAME_TARGET_MS-Math.max(other,otherWorkEMA),1.5,7); frame.last=[other,tC-tB];
  }catch(e){ console.error(e); if(!frame.crashed){ frame.crashed=true; paused=true; crash(e.message); } }
}
requestAnimationFrame(frame);
</script>
<template id="l102help-text">
<div data-lang="en"><p>You cannot see: click your tongue to light up the halls for a moment, find the exit, and don't let the blind creatures hear you. Headphones help a lot.</p><h3>On a computer</h3><ul><li>Click the screen to start; the mouse is captured to look around. <b>Esc</b> lets go of it and pauses.</li><li><b>W A S D</b> walk, <b>mouse</b> look, hold <b>Shift</b> to run (loud).</li><li><b>Space</b> echolocates: a wave of dots shows the walls. Monsters hear it, so don't overdo it.</li><li>Follow the green <b>EXIT</b> signs. <b>F</b> switches to full screen.</li></ul><h3>On a phone or tablet</h3><ul><li>Tap to start: the game goes full screen with the phone sideways.</li><li><b>Left thumb</b>: touch anywhere on the left and drag to walk. Push past the dashed outer ring to <b>run</b>.</li><li><b>Right thumb</b>: drag anywhere on the right to look around. To echolocate, tap the round <b>ECHO</b> button above it (sliding onto it while looking does nothing: it has to be a tap).</li><li>You can walk, run, look and echo at the same time. Leaving full screen pauses the game.</li></ul></div>
<div data-lang="es"><p>No puedes ver: chasquea la lengua para iluminar los pasillos un instante, encuentra la salida y que no te oigan las criaturas ciegas. Con auriculares es mucho mejor.</p><h3>En un ordenador</h3><ul><li>Haz clic en la pantalla para empezar; el ratón queda capturado para mirar. <b>Esc</b> lo suelta y pone pausa.</li><li><b>W A S D</b> para andar, el <b>ratón</b> para mirar y mantén <b>Mayús</b> para correr (hace ruido).</li><li><b>Espacio</b> ecolocaliza: una onda de puntos muestra las paredes. Los monstruos lo oyen, así que no abuses.</li><li>Sigue las señales verdes de <b>EXIT</b>. <b>F</b> pone la pantalla completa.</li></ul><h3>En un móvil o tableta</h3><ul><li>Toca para empezar: el juego se pone en pantalla completa con el móvil en horizontal.</li><li><b>Pulgar izquierdo</b>: toca en cualquier sitio de la izquierda y arrastra para andar. Llévalo más allá del anillo discontinuo para <b>correr</b>.</li><li><b>Pulgar derecho</b>: arrastra en cualquier sitio de la derecha para mirar. Para ecolocalizar, toca el botón redondo <b>ECO</b> que hay encima (deslizar el dedo hasta él mientras miras no hace nada: hay que tocarlo).</li><li>Puedes andar, correr, mirar y hacer eco a la vez. Salir de la pantalla completa pone pausa.</li></ul></div>
<div data-lang="de"><p>Du kannst nichts sehen: Schnalze mit der Zunge, damit die Gänge kurz aufleuchten, finde den Ausgang und lass dich von den blinden Wesen nicht hören. Mit Kopfhörern geht es viel besser.</p><h3>Am Computer</h3><ul><li>Klicke ins Bild, um zu starten; die Maus wird zum Umsehen eingefangen. <b>Esc</b> gibt sie frei und pausiert.</li><li><b>W A S D</b> gehen, <b>Maus</b> umsehen, <b>Shift</b> gedrückt halten zum Rennen (laut).</li><li>Die <b>Leertaste</b> macht ein Echo: Eine Welle aus Punkten zeigt die Wände. Die Monster hören das, also nicht zu oft.</li><li>Folge den grünen <b>EXIT</b>-Schildern. <b>F</b> schaltet auf Vollbild.</li></ul><h3>Auf dem Handy oder Tablet</h3><ul><li>Tippe zum Starten: Das Spiel geht ins Vollbild, mit quer gehaltenem Handy.</li><li><b>Linker Daumen</b>: irgendwo links auflegen und ziehen zum Gehen. Über den gestrichelten äußeren Ring hinaus schieben zum <b>Rennen</b>.</li><li><b>Rechter Daumen</b>: irgendwo rechts ziehen zum Umsehen. Für ein Echo den runden <b>ECHO</b>-Knopf darüber antippen (beim Umsehen darüber zu wischen zählt nicht: Er muss angetippt werden).</li><li>Gehen, rennen, umsehen und Echo gehen gleichzeitig. Wer das Vollbild verlässt, pausiert das Spiel.</li></ul></div>
